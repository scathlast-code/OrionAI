<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrionAI — Mini App — симуляція</title><style>*{box-sizing:border-box}body{margin:0;background:#0c151d;color:#edf7f4;font:15px system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid #a8efc8}header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:#152731;border-bottom:1px solid #34505a}header b{font-size:22px}header em{font-style:normal;color:#98e5bd}main{max-width:950px;margin:24px auto;padding:0 18px 110px}.pill{font-size:12px;border:1px solid #42625e;border-radius:99px;padding:7px 10px;color:#b3dbcb}.hero{font-size:30px;letter-spacing:-1px;margin:20px 0 6px}.muted{color:#a4b9b6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:#192e35;border:1px solid #35535a;border-radius:18px;padding:20px;min-width:0}.card h3{margin:4px 0 9px}.card p{color:#acc2bd;line-height:1.5}.btn{border:0;background:#a1e4bd;color:#10302a;border-radius:10px;padding:10px 13px;font-weight:700}.secondary{background:#2a4549;color:#ecf6f1}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.nav button{background:#1d353a;color:#d1e5dd;border:1px solid #38545a;padding:10px;border-radius:10px}.nav .active{background:#a1e4bd;color:#153129}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #355159}.note{border:1px solid #547a6a;background:#1c3934;border-radius:12px;padding:13px;margin:15px 0}.chat{max-width:660px}.bubble{background:#25463d;padding:14px;border-radius:15px;margin:10px 0 10px auto;max-width:85%}.bubble.bot{background:#223942;margin:10px auto 10px 0}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.toolbar button{border:1px solid #53756d;background:#294640;color:#e5f7ed;border-radius:9px;padding:9px}.search{padding:12px;border:1px solid #57736f;background:#11272b;color:white;border-radius:10px;width:100%;margin:10px 0}.small{font-size:12px;color:#a9c3ba}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{font-size:25px}header{padding:15px}}</style></head><body data-bot="orion" data-mode="miniapp"><header><b>✦ <em>OrionAI</em></b><span class="pill">Mini App</span></header><main><div class="note"><strong>Інтерактивна симуляція.</strong> Дані вигадані, дії зберігаються тільки у браузері. Реальні боти, API й Telegram не підключені.</div><div id="app"></div></main><script>const app=document.getElementById('app');let section='home',clean=false;const pages=['Огляд','Робота','Сценарії','Доступ','Налаштування'];const keys=['home','work','scenarios','access','settings'];const bot=document.body.dataset.bot,mode=document.body.dataset.mode;const name=bot==='orion'?'OrionAI':'OrionAI Manager';const key=(x)=>'orion_demo_'+bot+'_'+mode+'_'+x;function get(x,d){try{return JSON.parse(localStorage.getItem(key(x)))??d}catch{return d}}function set(x,v){localStorage.setItem(key(x),JSON.stringify(v))}function go(x){section=x;render()}function toggle(x){set(x,!get(x,true));render()}function render(){let html='<div class="nav">'+pages.map((p,i)=>`<button class="${section===keys[i]?'active':''}" onclick="go('${keys[i]}')">${p}</button>`).join('')+'</div>';if(section==='home')html+=`<h1 class="hero">Вітаємо в ${name}</h1><p class="muted">${mode==='chat'?'Telegram-бот':'Telegram Mini App'} · інтерфейс для щоденної роботи</p><div class="grid"><div class="card"><h3>✦ Почати роботу</h3><p>Завдання, повідомлення та історія.</p><button class="btn" onclick="go('work')">Відкрити</button></div><div class="card"><h3>⚙ Сценарії</h3><p>Керуйте поведінкою без десятків команд.</p><button class="btn" onclick="go('scenarios')">Налаштувати</button></div><div class="card"><h3>⛨ Доступ</h3><p>Дозволи, безпека, журнал змін.</p><button class="btn" onclick="go('access')">Переглянути</button></div><div class="card"><h3>☾ Режими</h3><p>Тиха година, сон, сповіщення.</p><button class="btn" onclick="go('settings')">Відкрити</button></div></div>`;if(section==='work')html+=`<h1 class="hero">${mode==='chat'?'Діалог':'Робочий простір'}</h1><div class="chat"><div class="bubble">Підготуй звіт із джерелами</div><div class="bubble bot">${clean?'Звіт містить аналіз, висновки та рекомендації.':'**Звіт**: аналіз, висновки та рекомендації.<br><br>Джерела: приклад, без реальної перевірки.'}</div><div class="toolbar"><button onclick="clean=!clean;render()">${clean?'Показати все':'Чистий текст'}</button><button onclick="navigator.clipboard?.writeText('Звіт містить аналіз, висновки та рекомендації.')">Копіювати</button><button onclick="alert('Демонстрація: реального запиту до API немає')">Нове завдання</button></div></div>`;if(section==='scenarios')html+=`<h1 class="hero">Сценарії</h1><p class="muted">Вимкнені сценарії зберігають налаштування.</p><div class="card">${[['dialog','Звичайний діалог'],['research','Глибоке дослідження'],['files','Файли та архіви'],['economy','Економія API'],['quality','Контроль якості']].map(([id,label])=>`<div class="row"><span>${label}</span><label><input type="checkbox" ${get('scenario_'+id,true)?'checked':''} onchange="toggle('scenario_${id}')"> Увімкнено</label></div>`).join('')}</div>`;if(section==='access')html+=`<h1 class="hero">Доступ і безпека</h1><div class="card"><h3>Постійні дозволи</h3><p>Дозволи прив'язані до конкретного бота. Це демонстраційні дані, без доступу до реальних користувачів.</p><div class="row">Приклад: користувач #12345 <span class="pill">Дозволено</span></div><div class="row">Геообмеження <span class="pill">За правилами сервера</span></div></div>`;if(section==='settings')html+=`<h1 class="hero">Налаштування</h1><div class="card">${[['quiet','Тиха година'],['sleep','Глибокий сон'],['tips','Поради після 14 днів'],['popup','Контекстні підказки']].map(([id,label])=>`<div class="row">${label}<input type="checkbox" ${get(id,false)?'checked':''} onchange="toggle('${id}')"></div>`).join('')}<div class="row">Звук <select class="search" style="max-width:160px" onchange="set('sound',this.value)">${[1,2,3,4,5].map(x=>`<option ${get('sound','1')==x?'selected':''}>${x}</option>`).join('')}</select></div><div class="row">Вібрація <select class="search" style="max-width:160px" onchange="set('vib',this.value)">${[1,2,3,4,5].map(x=>`<option ${get('vib','1')==x?'selected':''}>${x}</option>`).join('')}</select></div></div>`;app.innerHTML=html}render();</script></body></html>
