pl:news:Ou"]], [["🌐 Соцмережі", "m:pl:news:SN"], ["🏷 Теги", "m:pl:news:Tg"]], [["📶 RSS і вебхуки", "m:pl:news:so"]], [["✍️ Додати новину вручну", "m:pl:news:in"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:H2": {"text": "⚙️ <b>Налаштування ньюзруму<\/b>\n\n📤 Публікація: GreenPost 🌿\n✍️ Як писати: довжина вільна, базові правила, Word UA+RU ні\n🛡 Фільтри: блокувань 2, антиспам soft\n↪️ Переслане — у ньюзрум: так\n🔔 Сповіщення про автоматичні чернетки: так", "rows": [[["📤 Публікація", "m:pl:news:set"], ["✍️ Як писати", "m:pl:news:H3"]], [["🧩 Кнопки під новиною", "m:pl:news:acs"]], [["🛡 Фільтри", "m:pl:news:H4"]], [["↪️ Переслане → ньюзрум: так", "m:pl:news:Hfwd"]], [["🔔 Сповіщення: так", "m:pl:news:tg:notify"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:H5": {"text": "🗂 <b>Архів<\/b>\n\nУсе, що вже пройшло через ньюзрум.", "rows": [[["🗂 Усі чернетки", "m:pl:news:ls:ok"], ["📚 Історії", "m:pl:news:Sl"]], [["⭐ Обране й папки", "m:pl:news:Fo"], ["🧾 Зведення", "m:pl:news:dg"]], [["📁 Теки й архів новин", "m:pl:news:flds"]], [["⏳ Черга й помилки", "m:pl:news:q"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:help": {"text": "ℹ️ <b>Ньюзрум: як користуватися<\/b>\n\n<b>1. Віддати новину<\/b>\n• «📥 Надіслати новину» і вставте текст або посилання;\n• /news текст — або відповідайте /news на будь-яке повідомлення;\n• «Прийом: увімк.» — усе, що пересилаєте боту (дописи, фото з підписом), іде в ньюзрум.\n\n<b>2. Автоматично<\/b>\n• канали, де бот адміністратор (бот сам запропонує моніторинг);\n• RSS-стрічки (перше читання лише запам'ятовує старі пости);\n• WhatsApp Business і вебхук n8n — «📡 Джерела» → «🌐».\n\n<b>3. Чернетка<\/b> приходить із кнопками: ✅ схвалити, 🔁 інша версія, ✍️ правка своїми словами, 📏 точна довжина, 🔎 звірити з вебпошуком, ❌ відхилити, 📄 оригінал, 🕘 версії.\n\n<b>4. Публікація<\/b> — лише схваленого і лише в підключений канал. Автопублікація без людини неможлива.\n\n<b>5. Зведення<\/b> — /digest 2000 (або 2100, 2200, будь-яке 300–3800).\n\nПовтори (той самий або майже той самий текст за 72 год) відсіюються; схожі матеріали позначаються як можливе оновлення події.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:stk:hist": {"text": "🕘 <b>Історія завантажень<\/b>\n\n• 05.11 20:57 · 2 пак. · 184 файлів · 9.0 МБ\n  CuteCats, UkrEmoji", "rows": [[["🔁 Повторити: CuteCats, UkrE…", "m:pl:stk:again:1"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:stk:trk": {"text": "👁 <b>Стеження за пакетами<\/b>\n\nРаз на 6 год бот перевіряє пакети й пише, якщо автор додав або прибрав стікери.\n\n• Cute Cats · 120 шт · зміна: 03.11", "rows": [[["📦 Cute Cats", "m:pl:stk:one:1"], ["🗑", "m:pl:stk:untrk:1"]], [["➕ Стежити за пакетом", "m:pl:stk:trkask"]], [["🔄 Перевірити пакети", "m:pl:stk:chk"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:stk:help": {"text": "ℹ️ <b>Стікери: як це працює<\/b>\n\n• Працює через офіційний Telegram Bot API (getStickerSet + getFile) — без входу у ваш акаунт.\n• Формати оригінальні: .webp — статичні, .tgs — анімовані (Lottie), .webm — відео-стікери.\n• «📦 Один архів» — усі пакети в одному ZIP, кожен у своїй теці, однакові файли між пакетами збережено один раз (у manifest.json видно, що на що посилається). «🗂 Окремо» — свій ZIP на кожен пакет, повтори не прибираються.\n• Файл понад ~20 МБ Bot API не віддає; архів понад 45 МБ ділиться на частини — кожна відкривається окремо.\n• PNG-копії робляться лише для статичних .webp; анімацію в GIF не конвертуємо (див. «Розвиток»).\n• 🧩 Вибрати окремі — архів-чернетка, з якого кнопками прибираєте зайве, подаєте й затверджуєте.\n• Видалені, приватні чи недоступні пакети не завантажаться — помилка буде у звіті.\n\nКоманди: /stickerpack посилання · /stickers посилання (вибірковий режим).", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:grpx:start": {"text": "📌 <b>Де просідаємо<\/b> (жовтень 2026)\n• ✨ Астрологія — жодного допису\n• 🌾 Агро — жодного допису\n• 🩺 Здоровʼя — жодного допису\n• 🗺 :eco"]], [["⏰ За розкладом", "m:pl:news:sch:eco"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:dg": {"text": "🧾 <b>Зведення<\/b>\n\nУвімкніть збір і закидайте новини й тексти — потім одна шаблонна кнопка напише статтю.\n\nЗібрано: <b>0<\/b>", "rows": [[["▶️ Почати збір", "m:pl:news:cgo"], ["📋 Що зібрано", "m:pl:news:cls"]], [["Готуй: 🧾 Зведення 2200", "m:pl:news:cmk:t1"]], [["Готуй: 🧾 Зведення 2000", "m:pl:news:cmk:t2"]], [["Готуй: 🧾 Зведення 1000", "m:pl:news:cmk:t3"]], [["➕ Новини ньюзруму за добу н…", "m:pl:news:cday"]], [["🗑 Очистити зібране", "m:pl:news:cclr"]], [["⚙️ Шаблони зведень", "m:pl:news:ctp"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Tg": {"text": "🏷 <b>Теги<\/b>\n\nТег лише стежить: шукає новини за запитом і надсилає заголовки, опис і посилання. Писати — з картки знахідки (⋯) або кнопками пульта.\n\n🟢 <b>Укренерго відключення<\/b> · кожні 1 год · знайдено 17 · 20 хв тому\n🟢 <b>сміттєзвалище OR звалище<\/b> · кожні 1 год · знайдено 6 · 50 хв тому", "rows": [[["🟢 Укренерго відключення", "m:pl:news:Tgi:1"]], [["🟢 сміттєзвалище OR звалище", "m:pl:news:Tgi:2"]], [["➕ Новий тег", "m:pl:news:Tgadd"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:L": {"text": "📋 <b>Списки каналів і чатів<\/b>\n\nБот сам перевіряє кожне увімкнене джерело зі списків і бере звідти нові дописи в ньюзрум.\n\n🌐 Публічні канали (вебпревʼю): 🟢 працює\n📲 Службовий акаунт: ⚪️ не налаштовано\n🤖 Де бот адмін / учасник: дописи приходять самі\n\n🟢 <b>Області<\/b> — 10/10 увімк. · узято 40 · ⚠️1\n🟢 <b>Екологія<\/b> — 1/2 увімк. · узято 0\n🟢 <b>Офіційні<\/b> — 2/2 увімк. · узято 0\n🟢 <b>🤖 Де є бот<\/b> — 1/1 увімк. · узято 0 · авто\n🟢 <b>🏠 Наші канали й чати<\/b> — 4/4 увімк. · узято 0 · 🏠 наші", "rows": [[["🟢 Області · 10", "m:pl:news:Lo:1"]], [["🟢 Екологія · 2", "m:pl:news:Lo:2"]], [["🟢 Офіційні · 2", "m:pl:news:Lo:3"]], [["🟢 🤖 Де є бот · 1", "m:pl:news:Lo:4"]], [["🟢 🏠 Наші канали й чати · 4", "m:pl:news:Lo:5"]], [["➕ Новий список", "m:pl:news:Lnew"]], [["📤 Завантажити файл", "m:pl:news:Lup"]], [["📥 Вивантажити все", "m:pl:news:Lexp"]], [["🔄 Перевірити все зараз", "m:pl:news:Lnow"]], [["❓ Формат файлу", "m:pl:news:Lhelp"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Ou": {"text": "🏠 <b>Наші ресурси<\/b>\n\nЗвідси новини <b>не беруться<\/b>, але бот стежить за нашими публікаціями, щоб не повторюватись і бачити відгомін: репости, цитування, перекази, згадки, плагіат. Кожну нову новину він звіряє з нашими: ♻️ повтор, ➕ доповнення, 🔁 оновлення, ❌ спростування. Тоді бот надсилає посилання на всі наші згадки й усі оновлення цієї історії. Усе, що публікує сам ньюзрум, теж потрапляє сюди.\n\nКанали, чати й соцмережі: 4 (з них соцмереж 3) · сайти (RSS): 0 · публікацій у базі: 37\n📣 Відгомін: 4 · 🚩 плагіат 1\n\n<b>Останні наші:<\/b>\n• 09.11 Атака дронів на Київ уночі\n• 08.11 У Львові висадили 300 дерев\n• 07.11 На Дніпропетровщині збили дрони\n• 06.11 Сортування сміття в Одесі: як працює\n• 05.11 У Києві відкрили новий притулок для тварин\n• 05.11 Обстріл Харкова: пошкоджено школу", "rows": [[["📊 Звіт за місяць", "m:pl:news:rp"]], [["📣 Відгомін наших новин", "m:pl:news:echo"]], [["📋 Наші канали й чати", "m:pl:news:Lo:5"]], [["🌐 Наші соцмережі", "m:pl:news:SNadd:ours"]], [["🌐 Наш сайт (RSS)", "m:pl:news:Ours"]], [["➕ Додати нашу публікацію", "m:pl:news:Oua"]], [["📚 Історії з нашими", "m:pl:news:Sl:1"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:SN": {"text": "🌐 <b>Соцмережі<\/b> — новини з X, Threads, Instagram, Facebook, Tumblr, YouTube і будь-яких RSS\n\nЧужі акаунти — джерела новин (як канали). Наші — не беремо, а звіряємо: повтори, відгомін, плагіат і охоплення для 📊 звіту. Додавати можна і сюди, і в будь-який 📋 список — просто посиланням.\n\n𝕏 <b>X (Twitter)<\/b>: чужих 1 · наших 0 — ⚠️ не підключено\n🧵 <b>Threads<\/b>: чужих 1 · наших 1 — ⚠️ не підключено\n📸 <b>Instagram<\/b>: чужих 0 · наших 1 — ⚠️ не підключено\n📘 <b>Facebook<\/b>: чужих 1 · наших 1 — ⚠️ не підключено\n \"}<\/code>\n\nСигнал «я живий»: <code>https://&lt;адреса-бота&gt;/hub-ba52a8bcdfb3a994b9a71cf58d5e0d4ec7505b6c/hb<\/code> з <code>{\"key\": …, \"cmd_url\": …}<\/code>\nПростий варіант для будь-якого сервісу (GET):\n<code>https://&lt;адреса-бота&gt;/hub-ba52a8bcdfb3a994b9a71cf58d5e0d4ec7505b6c/in?key=…&amp;text=…<\/code>\n\nКлюч кожного бота — у його картці → «🔌 Підключення».\nВручну: просто перешліть мені повідомлення від будь-якого бота.\nНапряму в Telegram: увімкніть «Bot-to-Bot Communication» у @BotFather для обох ботів — тоді бот може писати мені сам.", "rows": [[["📖 Детально", "m:pl:hub:~:6ea29de6"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:tr": {"text": "<b>🗑 Кошик<\/b> · автоматичне видалення вимкнено\n\n<i>Порожньо.<\/i>", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bk": {"text": "<b>💾 Резервні копії<\/b>\n\nЗа замовчуванням бот <b>нічого не архівує автоматично<\/b>. Автокопії почнуться лише після того, як ви самі задасте розклад.\nАвтокопії: <b>⏹ вимкнено<\/b>\nФормати: <b>ZIP<\/b>\nВміст: <b>Лише дані бота<\/b>\nОстання копія: <b>ще не було<\/b>\nШифрування: <b>▫️ без пароля<\/b>\n\n<b>Куди зберігати:<\/b>\n✅ 📱 Файлом у чат · ⏹ автоматичні копії зупинено\n📢 Приватний канал Telegram: ▫️ не підключено\n🟢 Google Диск: ▫️ потрібні GDRIVE_CLIENT_ID і GDRIVE_CLIENT_SECRET та PUBLIC_URL\n🔵 Dropbox: ▫️ потрібні DROPBOX_APP_KEY і DROPBOX_APP_SECRET та PUBLIC_URL\n🟦 OneDrive: ▫️ потрібні ONEDRIVE_CLIENT_ID і ONEDRIVE_CLIENT_SECRET та PUBLIC_URL", "rows": [[["💾 Зробити копію зараз", "m:pl:hub:bkgo"]], [["📦 Формати", "m:pl:hub:bkfmt"], ["🗂 Вміст копії", "m:pl:hub:bkscope"]], [["📱 Файлом у чат", "m:pl:hub:bkt:file"]], [["📢 Приватний канал Telegram", "m:pl:hub:bkt:channel"]], [["🟢 Google Диск", "m:pl:hub:bkt:gdrive"]], [["🔵 Dropbox", "m:pl:hub:bkt:dropbox"]], [["🟦 OneDrive", "m:pl:hub:bkt:onedrive"]], [["♻️ Відновити", "m:pl:hub:bkrs"], ["ℹ️ Довідка", "m:pl:hub:~:26439b1f"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:btn": {"text": "<b>🎛 Кнопки й меню<\/b>\n\nЗмінюйте все: де стоїть кожен розділ, назви, групи (підменю), порядок і кількість кнопок у ряду.\n\n<b>⌨️ меню внизу:<\/b> 🤖 Боти · 📥 Вхідні · 📨 Надіслати · ☰ Меню\n<b>🏠 «Меню»:<\/b> 📡 Моніторинг · 🔀 Пересилання · 📋 Таблиця ботів · 🏘 Спільноти · 📌 Закріплені · 🧰 Інструменти · 📖 Довідка\n<b>📂 🧰 Інструменти:<\/b> 🔌 Підключення · 🗑 Кошик · 💾 Резервні копії · 🎛 Кнопки · 🩺 Діагностика · 🏭 Скидання\n<b>🚫 приховано:<\/b> —\n\nНатисніть на розділ, щоб змінити його.", "rows": [[["🤖 Боти", "m:pl:hub:bi:bots"], ["📥 Вхідні", "m:pl:hub:bi:inbox"]], [["📨 Надіслати", "m:pl:hub:bi:send"], ["☰ Меню", "m:pl:hub:bi:menu"]], [["📡 Моніторинг", "m:pl:hub:bi:mon"], ["🔀 Пересилання", "m:pl:hub:bi:rules"]], [["📋 Таблиця ботів", "m:pl:hub:bi:btable"], ["🏘 Спільноти", "m:pl:hub:bi:comm"]], [["📌 Закріплені", "m:pl:hub:bi:pins"], ["🧰 Інструменти", "m:pl:hub:bi:g:tools"]], [["📖 Довідка", "m:pl:hub:bi:help"], ["🔌 Підключення", "m:pl:hub:bi:api"]], [["🗑 Кошик", "m:pl:hub:bi:trash"], ["💾 Копії", "m:pl:hub:bi:backup"]], [["🎛 Кнопки", "m:pl:hub:bi:btns"], ["🩺 Діагностика", "m:pl:hub:bi:diag"]], [["🏭 Скидання", "m:pl:hub:bi:reset"]], [["➕ Нова група", "m:pl:hub:bgnew"]], [["✏️ Будь-яка кнопка", "m:pl:hub:brl"]], [["⌨️ У ряд:", "m:pl:hub:noop"], ["1", "m:pl:hub:bset:kb_cols:1"], ["● 2", "m:pl:hub:bset:kb_cols:2"], ["3", "m:pl:hub:bset:kb_cols:3"], ["4", "m:pl:hub:bset:kb_cols:4"]], [["🏠 У ряд:", "m:pl:hub:noop"], ["1 · інше", "m:pl:hub:bset:home_cols:1"], ["● 2 · інше", "m:pl:hub:bset:home_cols:2"], ["3 · інше", "m:pl:hub:bset:home_cols:3"]], [["↺ Усе як було спочатку", "m:pl:hub:breset"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:diag": {"text": "<b>🩺 Діагностика<\/b>\n\nЗагальний стан: <b>33%<\/b> ▰▰▰▱▱▱▱▱\n\n✅ Працює: <b>0<\/b> · ❌ проблем: <b>2<\/b>\n⚠️ Суперечностей: <b>0<\/b> · 💡 порад: <b>2<\/b> · 🤝 гармонійно: <b>1<\/b>\n🤖 0 ботів · 🟢 0 працюють · 📥 0 непрочитаних · 🔀 0 правил\n\n<b>Головне зараз:<\/b>\n🌐 MANAGER_PUBLIC_URL не задано — скринька й вхід у хмари не працюватимуть\n💾 Остання копія: ще не робилася", "rows": [[["● 🩺 Огляд", "m:pl:hub:diag:sum"], ["✅ Стан", "m:pl:hub:diag:state"], ["📊 Цифри", "m:pl:hub:diag:nums"], ["💡 Поради", "m:pl:hub:diag:tips"]], [["🤖 Боти", "m:pl:hub:bl"], ["📡 Моніторинг", "m:pl:hub:mon"], ["🔀 Правила", "m:pl:hub:rl"]], [["💾 Копії", "m:pl:hub:bk"], ["🎛 Кнопки", "m:pl:hub:btn"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:fr": {"text": "<b>🏭 Скидання до заводських налаштувань<\/b>\n\nПозначте, що скинути або стерти. <b>Не зачіпається ніколи:<\/b> ваші боти, їхні токени, ключі скриньки, адреси команд і bot-to-bot, підключені хмари для копій.\n\nПеред скиданням я надішлю вам резервну копію.", "rows": [[["✅ ⚙️ Налаштування (сортуван…", "m:pl:hub:frt:settings"]], [["✅ 🎛 Кнопки й меню (розташув…", "m:pl:hub:frt:buttons"]], [["▫️ 📡 Стеження за ботами: зн…", "m:pl:hub:frt:watch"]], [["▫️ 📥 Вхідні (усі події)", "m:pl:hub:frt:events"]], [["▫️ 🔀 Правила пересилання", "m:pl:hub:frt:rules"]], [["▫️ 🗑 Кошик (події; боти з к…", "m:pl:hub:frt:trash"]], [["▫️ 🏘 Спільноти: правила, до…", "m:pl:hub:frt:community"]], [["☑️ Усе", "m:pl:hub:frt:all"]], [["▫️ Лише налаштування", "m:pl:hub:frt:min"]], [["🏭 Скинути вибране", "m:pl:hub:frgo"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bi:g:tools": {"text": "<b>🎛 🧰 Інструменти<\/b>\n\nГрупа (підменю). Зараз: <b>🏠 «Меню»<\/b>\nУсередині: 🔌 Підключення · 🗑 Кошик · 💾 Резервні копії · 🎛 Кнопки · 🩺 Діагностика · 🏭 Скидання\n\nКуди поставити:", "rows": [[["⌨️ Внизу", "m:pl:hub:bmv:g:tools:kb"], ["● 🏠 У «Меню»", "m:pl:hub:bmv:g:tools:home"]], [["🚫 Сховати", "m:pl:hub:bmv:g:tools:off"]], [["⬆️ Вище", "m:pl:hub:bup:g:tools"], ["⬇️ Нижче", "m:pl:hub:bdn:g:tools"]], [["✏️ Назва", "m:pl:hub:lren:g:tools"]], [["🗑 Видалити групу", "m:pl:hub:bgdel:tools"]], [["🎛 Усі кнопки", "m:pl:hub:btn"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:4fa37d1b": {"text": "<b>🚀 З чого почати<\/b>\n\n1. «🤖 Боти» → «➕ Додати бота»: Telegram — токен від @BotFather; WhatsApp — ID номера й постійний токен Meta; Instagram — токен Instagram API; «Інший» — будь-який сервіс чи скрипт.\n2. Токен я перевіряю й одразу видаляю ваше повідомлення з ним із чату. У базі токени зашифровані.\n3. У картці бота → «🔌 Підключення» — адреса скриньки й ключ: з ними бот може писати мені сам.\n4. «🔀 Пересилання» — правила, хто кому передає повідомлення.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:a7f2a576": {"text": "<b>🔌 Скринька й команди<\/b>\n\n<b>Бот → головний:<\/b> POST на адресу скриньки з JSON <code>{key, type, text}<\/code>. Типи: alert (тривога — завжди зі сповіщенням), info, report.\n<b>Сигнал «я живий»:<\/b> POST …/hb з <code>{key}<\/code> раз на кілька хвилин. Якщо бот мовчить довше за HEARTBEAT_TIMEOUT — я напишу, що він упав. Разом із сигналом бот може повідомити свою адресу команд <code>cmd_url<\/code>.\n<b>Головний → бот:<\/b> я надсилаю POST на cmd_url з <code>{key, text, type, from, hop}<\/code>. Якщо бот відповідає <code>{\"reply\": \"…\"}<\/code>, відповідь з'являється у «Вхідних».\n<b>Без коду:<\/b> перешліть мені будь-яке повідомлення бота — воно стане подією цього бота.\n<b>Bot-to-bot:<\/b> з травня 2026 Telegram дозволяє ботам писати одне одному в особисті, якщо в обох увімкнено режим у @BotFather.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:7686c03b": {"text": "<b>🔀 Пересилання й захист<\/b>\n\nПравило передає подію іншому боту автоматично. Вручну — кнопка «↪️ Переслати боту» під будь-якою подією.\nЗахист від зациклень:\n• кожна передача рахується; після RELAY_MAX_HOPS (3) далі не йде;\n• однаковий текст від того самого бота за 2 хв відкидається;\n• понад RELAY_RATE_PER_MIN (30) повідомлень за хвилину від бота — пауза 5 хв і сповіщення вам.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:242067df": {"text": "<b>📡 Моніторинг<\/b>\n\nTelegram: getMe (токен живий) і getWebhookInfo (черга, помилки вебхука). WhatsApp: стан номера та якість (зелена/жовта/червона). Instagram: чи дійсний токен. Інші боти: сигнал «я живий». Я пишу лише при зміні стану: впав → 🔴, проблема → 🟡, піднявся → 🟢 з тривалістю збою.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:2f779124": {"text": "<b>🏆 Пріоритети<\/b>\n\n<b>🏆 Пріоритети<\/b> (ШІ-бот: «🧰 Інструменти → 🏆 Пріоритети»; тут — «📋 Таблиця ботів»)\n\nРейтинг для <b>розмов і проєктів<\/b>, <b>відкладених та запланованих завдань<\/b>, <b>ботів і ШІ<\/b>, з якими працює бот, і <b>спільнот<\/b> (каналів, груп). ⬆️/⬇️ — вище чи нижче; у картці елемента — «на самий верх», «у самий низ», «звичайний». Те саме — кнопка «🏆 Пріоритет» на екрані розмови й завдання.\nТри зони: 🔺 важливіші · ▫️ звичайні (усе нове) · 🔻 менш важливі.\n\n<b>Як це працює<\/b>\n• Одночасно до ШІ йде LLM_PARALLEL запитів (типово 2). Коли всі місця зайняті й приходить важливіший запит — менш важливий <b>не відхиляється<\/b>, а стає на ⏸ паузу і продовжиться сам, щойно звільниться місце.\n• Менш важливий новий запит стає в 🕒 чергу (за пріоритетом).\n• Той, хто питав, одразу отримує сповіщення: розмова — повідомлення в чат, бот — повідомлення через головного бота, ШІ через конектор — статус «queued» з номером.\n• Пауза — не відмова: у сповіщенні й у відповіді є прапорці <code>queued / keep_waiting / do_not_retry / do_not_cancel<\/code>. Боти й моделі не скасовують і не надсилають завдання знову — просто чекають своєї черги. Повтор того самого запиту не створює дубля.\n• Відкладені завдання бот виконує від важливіших до менш важливих.\n• Після паузи модель відповідає на запит заново (проміжного тексту в безкоштовних API немає), але запит, історія й пам'ять проєкту зберігаються повністю.\n\n<b>🤝 Боти й ШІ<\/b> — таблиця всіх, хто звертався до бота (головний бот, боти через нього, ШІ через конектор): посилання, скільки запитів, коли востаннє, звідки. Їхній порядок — це їхній пріоритет.\n<b>🏘 Спільноти<\/b> — таблиця «де бот» теж сортується за пріоритетом; дописи для важливіших спільнот виходять першими.\nУ 🧭 головному боті — «📋 Таблиця ботів»: посилання, тип, стан, пріоритет (⬆️⬇️) і файл для Excel. Запити важливіших ботів він пересилає першими й передає отримувачу їхній пріоритет.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:83b42723": {"text": "<b>🏘 Групи, канали, спільноти<\/b>\n\n<b>🏘 Бот у групах, каналах і спільнотах<\/b> (у меню → «🏘 Спільноти»)\n\n<b>Як додати (Telegram)<\/b>: група/канал → Додати учасника → бот → зробіть <b>адміністратором<\/b> (видаляти повідомлення, блокувати, запрошувати; у каналі — публікувати). Бот сам з'явиться в списку й напише вам. Типово додавати бота може лише власник — інакше він сам вийде з чату (перемикач 🔒).\n\n<b>🛡 Правила<\/b> — заборони для учасників: посилання, пересилання, фото/файли, стікери й GIF, голосові, згадки @, заборонені слова, КАПС, флуд, тиша для новачків, нічна тиша. Адмінів чату не стосуються.\n<b>⚖️ Покарання<\/b>: видалити · видалити й попередити (після N — тиша на добу) · заглушити на час · вигнати.\n<b>👤 Хто що може<\/b> — окремі дозволи й заборони понад загальні правила: для <b>всіх<\/b>, для <b>новачків<\/b>, для <b>групи учасників<\/b> або для <b>конкретної людини<\/b>. Кожне правило: ▫️ як загалом → ✅ дозволено → ⛔ заборонено; є «дозволити/заборонити все» й правило «🤐 Писати взагалі» (лише читання).\nДе діє: лише в цій спільноті, «🌐 у всіх спільнотах» або «📍 скопіювати в інші» — одну, кілька чи всі.\nПріоритет: людина › група › новачки › усі; налаштування спільноти важливіші за загальні; якщо людина в кількох групах і одна забороняє — забороняє.\n<b>🏷 Групи учасників<\/b> («Довірені», «VIP», «Під наглядом»…) — люди з будь-яких спільнот: додати зі списку тих, хто писав, за @ім'ям/ID (кількох одразу), або в чаті у відповідь на повідомлення <code>/group VIP<\/code>, прибрати — <code>/ungroup VIP<\/code>. Кілька @імен в «👤 Учаснику…» — бот сам створить з них групу-вибірку.\n<b>🙋 Дозволи за запитом<\/b>: під попередженням є кнопка «Попросити дозвіл» (або команда /request у чаті). Вам приходить запит → ✅ на 1 год / день / 7 днів / назавжди або ❌. Так само — «Попросити розблокувати». Дозволи видно й можна забрати в «🙋 Запити».\n<b>🚪 Вступ<\/b>: заявки — приймати всіх, питати вас або не чіпати; привітання новачків ({name} — ім'я); нове посилання-запрошення.\n<b>📣 Публікації<\/b>: допис зараз, через годину, у певний час, щодня, щотижня (дописи від ШІ — у ШІ-боті).\n<b>👁 Моніторинг<\/b>: слова-тригери або «пересилати все» — вам у приват (і головному боту).\n<b>📜 Журнал<\/b> дій і цифри (також у 🩺 Діагностиці).\n<b>📋 Таблиця «де бот»<\/b>: скільки груп, каналів і спільнот, з посиланнями, @іменами, кількістю учасників і чи бот адмін; «📄 Файл» — та сама таблиця для Excel/Google Таблиць. Для приватних чатів бот створює власне посилання-запрошення (основне посилання чату не чіпає).\n\n<b>Команди в групі<\/b>: усім — /rules, /request; адмінам чату у відповідь на повідомлення — /warn, /mute 30, /unmute, /ban, /unban, /allow links.\n\n<b>WhatsApp<\/b>: групи вашого номера через Groups API (лише офіційні бізнес-акаунти, до 8 учасників): публікації, заявки на вступ, видалення порушника з групи. Чужі повідомлення WhatsApp видаляти не дозволяє — замість цього попередження (кожне рахується в 1000 безкоштовних/міс).\n<b>Instagram<\/b>: груп в API немає; бот модерує коментарі під вашими дописами (сховати/видалити за правилами) і публікує дописи з картинкою.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:4b035fa7": {"text": "<b>✏️ Що можна міняти<\/b>\n\nTelegram: назву, опис, короткий опис, список команд, писати від імені бота. Лише в @BotFather: аватар, inline-режим, створення й видалення ботів, передача власності.\nWhatsApp: опис, статус «Про мене», команди «/». Назву номера змінює Meta після перевірки.\nInstagram: швидкі питання (Ice Breakers). Профіль — лише в застосунку.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:31a8d6fd": {"text": "<b>🛡 Безпека<\/b>\n\n• Головний бот відповідає лише власнику (ALLOWED_USERS).\n• Токени в базі зашифровані ключем з MANAGER_SECRET. Не змінюйте його, інакше токени доведеться ввести знову.\n• Якщо токен міг потрапити до чужих рук: @BotFather → /revoke → новий токен → у картці бота «🔑 Замінити токен».\n• Увімкніть двоетапну перевірку в Telegram — це захищає і акаунт, і всіх ботів.\n• Резервні копії — у «🧰 Інструменти».", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:ccd73b5d": {"text": "<b>🎛 Кнопки<\/b>\n\nУсі розділи можна переставляти між меню внизу, «Меню» і групами, перейменовувати, ховати, створювати свої групи. Будь-яку кнопку бота можна перейменувати: «Старий = Новий». У кожному меню є «◀️ Назад», «🏠 Додому» і «Вперед ▶️».", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:inb:who:all": {"text": "⚙️ <b>Налаштування скриньки<\/b>\n\nХто може писати вам: <b>пишуть усі<\/b>\nВідповідь людині «✅ Передав»: так\nСповіщення: зі звуком\nЗахист від флуду: до 20 повідомлень за 10 хв від однієї людини\n\nПривітання (на /start):\n<i>👋 Вітаю! Напишіть повідомлення або надішліть новину, фото чи файл — я передам власнику, і він відповість тут.<\/i>\n\nУчасники бота пишуть вам через /owner або «📮 Написати власнику»; незнайомі — просто пишуть боту.", "rows": [[["● Пишуть усі", "m:pl:inb:who:all"]], [["Лише учасники бота", "m:pl:inb:who:members"]], [["Ніхто", "m:pl:inb:who:closed"]], [["✅ «Передав»: так", "m:pl:inb:ack"], ["🔔 Зі звуком", "m:pl:inb:sil"]], [["✏️ Привітання", "m:pl:inb:gr"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:inb:who:members": {"text": "⚙️ <b>Налаштування скриньки<\/b>\n\nХто може писати вам: <b>лише учасники бота<\/b>\nВідповідь людині «✅ Передав»: так\nСповіщення: зі звуком\nЗахист від флуду: до 20 повідомлень за 10 хв від однієї людини\n\nПривітання (на /start):\n<i>👋 Вітаю! Напишіть повідомлення або надішліть новину, фото чи файл — я передам власнику, і він відповість тут.<\/i>\n\nУчасники бота пишуть вам через /owner або «📮 Написати власнику»; незнайомі — просто пишуть боту.", "rows": [[["Пишуть усі", "m:pl:inb:who:all"]], [["● Лише учасники бота", "m:pl:inb:who:members"]], [["Ніхто", "m:pl:inb:who:closed"]], [["✅ «Передав»: так", "m:pl:inb:ack"], ["🔔 Зі звуком", "m:pl:inb:sil"]], [["✏️ Привітання", "m:pl:inb:gr"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:inb:who:closed": {"text": "⚙️ <b>Налаштування скриньки<\/b>\n\nХто може писати вам: <b>ніхто (закрито)<\/b>\nВідповідь людині «✅ Передав»: так\nСповіщення: зі звуком\nЗахист від флуду: до 20 повідомлень за 10 хв від однієї людини\n\nПривітання (на /start):\n<i>👋 Вітаю! Напишіть повідомлення або надішліть новину, фото чи файл — я передам власнику, і він відповість тут.<\/i>\n\nУчасники бота пишуть вам через /owner або «📮 Написати власнику»; незнайомі — просто пишуть боту.", "rows": [[["Пишуть усі", "m:pl:inb:who:all"]], [["Лише учасники бота", "m:pl:inb:who:members"]], [["● Ніхто", "m:pl:inb:who:closed"]], [["✅ «Передав»: так", "m:pl:inb:ack"], ["🔔 Зі звуком", "m:pl:inb:sil"]], [["✏️ Привітання", "m:pl:inb:gr"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:inb:ack": {"text": "⚙️ <b>Налаштування скриньки<\/b>\n\nХто може писати вам: <b>ніхто (закрито)<\/b>\nВідповідь людині «✅ Передав»: ні\nСповіщення: зі звуком\nЗахист від флуду: до 20 повідомлень за 10 хв від однієї людини\n\nПривітання (на /start):\n<i>👋 Вітаю! Напишіть повідомлення або надішліть новину, фото чи файл — я передам власнику, і він відповість тут.<\/i>\n\nУчасники бота пишуть вам через /owner або «📮 Написати власнику»; незнайомі — просто пишуть боту.", "rows": [[["Пишуть усі", "m:pl:inb:who:all"]], [["Лише учасники бота", "m:pl:inb:who:members"]], [["● Ніхто", "m:pl:inb:who:closed"]], [["✅ «Передав»: ні", "m:pl:inb:ack"], ["🔔 Зі звуком", "m:pl:inb:sil"]], [["✏️ Привітання", "m:pl:inb:gr"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:inb:sil": {"text": "⚙️ <b>Налаштування скриньки<\/b>\n\nХто може писати вам: <b>ніхто (закрито)<\/b>\nВідпо  @greenpostua · 0\n2. 🟢 GreenPost Instagram · 📸 Instagram · @greenpost.ua · 0\n3. 🟢 GreenPost Threads · 🧵 Threads · @greenpost.ua · 0\n4. 🟢 GreenPost Facebook · 📘 Facebook · greenpostua · 0", "rows": [[["🟢 1. GreenPost", "m:pl:news:Le:12"]], [["🟢 2. GreenPost Instagram", "m:pl:news:Le:17"]], [["🟢 3. GreenPost Threads", "m:pl:news:Le:18"]], [["🟢 4. GreenPost Facebook", "m:pl:news:Le:19"]], [["➕ Додати", "m:pl:news:Ladd:5"], ["📤 Імпорт", "m:pl:news:Lup:5"]], [["🔃 Сортувати", "m:pl:news:Lsort:5"], ["✂️ Масові дії", "m:pl:news:Lbulk:5"]], [["⚙️ Цей список", "m:pl:news:Ls:5"]], [["🔄 Перевірити список", "m:pl:news:Lnow:5"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Lhelp": {"text": "❓ <b>Формат списків<\/b>\n\nНадішліть файл <b>.txt, .csv, .xlsx або .json<\/b> (до 5 МБ) або вставте текст. Один рядок — одне джерело:\n<code>@kanal | Назва | Область | так<\/code>\n<code>https://t.me/kanal<\/code>\n<code>t.me/+запрошення | Закритий чат<\/code>\n<code>-1001234567890 | Група за id<\/code>\n\n• Назва, область і «так/ні» (увімкнено) — необов'язкові. Роздільник: | ; табуляція або кома.\n• Рядок <code>## Назва списку<\/code> починає новий список — один файл може містити кілька списків.\n• У CSV/Excel можна мати заголовки: посилання, назва, область, увімк. Кожен аркуш Excel — окремий список.\n• Рядки з # — коментарі. Повтори в межах списку пропускаються, наявні джерела оновлюються.\n\n<b>Хто що читає<\/b>\n🌐 публічні канали — без акаунта, через вебпревʼю t.me/s;\n📲 групи, чати, приватні канали й запрошення — потрібен службовий акаунт (TELEGRAM_SESSION);\n🤖 канали, де бот адміністратор, і групи з ботом — дописи приходять самі.\n\nФайл, вивантажений кнопкою «📥 Вивантажити», можна відредагувати й завантажити назад.", "rows": [[["📤 Завантажити файл", "m:pl:news:Lup"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:echo": {"text": "📣 <b>Відгомін наших новин<\/b>\n\nХто репостить, пересилає, цитує, переказує, згадує нас — і хто передруковує майже дослівно без посилання.\n<i>Рерайт своїми словами — це переказ, не плагіат. Плагіат — лише ідентичний або майже ідентичний текст (≥ 85 %) без посилання.<\/i>\n\n🚩 Клон-канал · 17.10 10:57 · 90 % · без посилання\n   «…»\n✍️ Новини Полтави · 16.10 10:57 · 90 %\n   «…»\n🔁 Зоозахист UA · 15.10 10:57 · 90 %\n   «…»\n💬 Київ Оперативний · 14.10 10:57 · 90 %\n   «…»", "rows": [[["● Усе · 4", "m:pl:news:echo"], ["🔁 1", "m:pl:news:echo:repost"], ["📄 0", "m:pl:news:echo:copy"], ["🚩 1", "m:pl:news:echo:plagiarism"]], [["💬 1", "m:pl:news:echo:quote"], ["✍️ 1", "m:pl:news:echo:retell"], ["🏷 0", "m:pl:news:echo:mention"]], [["🚩 Клон-канал", "m:pl:news:eci:4"]], [["✍️ Новини Полтави", "m:pl:news:eci:3"]], [["🔁 Зоозахист UA", "m:pl:news:eci:2"]], [["💬 Київ Оперативний", "m:pl:news:eci:1"]], [["● 🔔 Важливе", "m:pl:news:ecn:important"], ["🔔 Усе", "m:pl:news:ecn:all"], ["🔕 Тихо", "m:pl:news:ecn:off"]], [["🏷 Наші назви", "m:pl:news:ecb"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:SNadd:ours": {"text": "🏠 <b>Наші акаунти в соцмережах<\/b>\n\nВставте посилання — по одному в рядку, можна з назвою й областю через «|»:\n<code>https://x.com/name\nhttps://www.threads.net/@name | Назва | Київ\nhttps://instagram.com/name\nhttps://facebook.com/page\nhttps://name.tumblr.com\nhttps://site.ua/rss<\/code>\n\nАбо коротко: <code>x:name · threads:name · ig:name · fb:page · tumblr:name · rss:https://…<\/code>", "rows": [[["✖️ Скасувати", "m:cancel"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Ours": {"text": "🌐 <b>Які RSS-стрічки — наші?<\/b>\n🏠 — наша (не беремо, лише звіряємо). Додайте RSS свого сайту в «📡 RSS» і позначте тут.", "rows": [[["➕ Додати RSS", "m:pl:news:soadd"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Sl:1": {"text": "📚 <b>Історії<\/b> — схожі новини й теми, згруповані разом\n\n• #25 🏠 У Києві висадять 800 дерев на Осокорках · 1 матеріалів · щойно\n• #16 🏠 Атака дронів на Київ уночі · 3 матеріалів · щойно\n• #15 🏠 У Львові висадили 300 дерев · 3 матеріалів · щойно\n• #24 🏠 На Дніпропетровщині збили дрони · 2 матеріалів · щойно\n• #23 🏠 Сортування сміття в Одесі: як працює · 2 матеріалів · щойно\n• #22 🏠 У Києві відкрили новий притулок для тварин · 2 матеріалів · щойно\n• #21 🏠 Обстріл Харкова: пошкоджено школу · 2 матеріалів · щойно\n• #20 🏠 Екоакція на Дніпрі в Києві · 2 матеріалів · щойно\n• #19 🏠 Енергетики: графіки на Харківщині · 2 матеріалів · щойно\n• #18 🏠 Обстріл Запоріжжя: є поранені · 2 матеріалів · щойно\n• #17 🏠 Притулок у Полтаві шукає волонтерів · 2 матеріалів · щойно\n• #14 🏠 На Дніпропетровщині збили дрони · 1 матеріалів · щойно", "rows": [[["🏠 #25 У Києві висадять 800…", "m:pl:news:St:25"]], [["🏠 #16 Атака дронів на Київ…", "m:pl:news:St:16"]], [["🏠 #15 У Львові висадили 300…", "m:pl:news:St:15"]], [["🏠 #24 На Дніпропетровщині з…", "m:pl:news:St:24"]], [["🏠 #23 Сортування сміття в О…", "m:pl:news:St:23"]], [["🏠 #22 У Києві відкрили нови…", "m:pl:news:St:22"]], [["🏠 #21 Обстріл Харкова: пошк…", "m:pl:news:St:21"]], [["🏠 #20 Екоакція на Дніпрі в…", "m:pl:news:St:20"]], [["🏠 #19 Енергетики: графіки н…", "m:pl:news:St:19"]], [["🏠 #18 Обстріл Запоріжжя: є…", "m:pl:news:St:18"]], [["🏠 #17 Притулок у Полтаві шу…", "m:pl:news:St:17"]], [["🏠 #14 На Дніпропетровщині з…", "m:pl:news:St:14"]], [["Усі історії", "m:pl:news:Sl:0"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:SNadd:other": {"text": "🌐 <b>Чужі акаунти в соцмережах<\/b>\n\nВставте посилання — по одному в рядку, можна з назвою й областю через «|»:\n<code>https://x.com/name\nhttps://www.threads.net/@name | Назва | Київ\nhttps://instagram.com/name\nhttps://facebook.com/page\nhttps://name.tumblr.com\nhttps://site.ua/rss<\/code>\n\nАбо коротко: <code>x:name · threads:name · ig:name · fb:page · tumblr:name · rss:https://…<\/code>", "rows": [[["✖️ Скасувати", "m:cancel"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:SNk": {"text": "🔑 <b>Як підключити соцмережі<\/b>\n\nКлючі вписуються лише у файл <code>.env<\/code> на сервері — ніколи не надсилайте їх у чат.\n\n𝕏 <b>X (Twitter)<\/b>: <code>X_BEARER_TOKEN<\/code> (developer.x.com, платний тариф) — будь-які публічні акаунти + перегляди, лайки, репости.\n🧵 <b>Threads<\/b>: <code>THREADS_TOKEN<\/code>, <code>THREADS_USERNAME<\/code> — ваш акаунт із переглядами й реакціями; чужі — через RSSHub.\n📸 <b>Instagram<\/b>: <code>META_TOKEN<\/code> + <code>IG_USER_ID<\/code> (Business/Creator, привʼязаний до сторінки Facebook) — ваш акаунт і чужі Business/Creator-акаунти; особисті — лише через RSSHub.\n📘 <b>Facebook<\/b>: <code>FB_PAGE_TOKENS=сторінка=токен,…<\/code> — ваші сторінки з реакціями, коментарями, поширеннями; чужі сторінки — якщо застосунок Meta має дозвіл Page Public Content Access, інакше RSSHub.\n🌀 <b>Tumblr<\/b>: працює без ключа (RSS); <code>TUMBLR_API_KEY<\/code> додає кількість нотаток.\n▶️ <b>YouTube<\/b> і будь-який <b>RSS<\/b> — без ключів.\n\n🧰 <b>RSSHub<\/b> (<code>RSSHUB_URL<\/code>, необовʼязково <code>RSSHUB_KEY<\/code>) — власний сервіс у docker-compose, запасний шлях для чужих X/Threads/Instagram/Facebook без офіційного доступу. Він читає публічні сторінки, тож працює не завжди — і дотримання правил платформ на вас.\n\nОбмеження частоти: X — раз на 30 хв, Instagram — 20 хв, Facebook і Threads — 15 хв на акаунт.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:hooks": {"text": "🌐 <b>Зовнішні входи ньюзруму<\/b>\n\n<b>Вебхук для n8n / Make / Zapier<\/b>\nPOST /‹MCP_SECRET›/newsroom/ingest\nТіло JSON: <code>{\"text\": \"…\", \"url\": \"…\", \"source\": \"назва\"}<\/code>\nПовна адреса — PUBLIC_URL/MCP_SECRET/newsroom/ingest (секрет у самій адресі, не публікуйте її).\n\n<b>WhatsApp Business Cloud API<\/b>: ⚪️ не налаштовано\nCallback URL: PUBLIC_URL/MCP_SECRET/newsroom/whatsapp\nЗмінні: WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_SECRET, WHATSAPP_ALLOWED_SENDERS (номери без +), за бажанням WHATSAPP_ACCESS_TOKEN для фото. Підпис X-Hub-Signature-256 перевіряється.\n\nЗагального доступу до особистих чатів і груп WhatsApp офіційний API не дає. Деталі — docs/17-plugins.md.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:setlen": {"text": "📏 <b>Довжина нових новин<\/b>\n\nЗастосовується до матеріалів, що надійдуть після зміни.", "rows": [[["● Вільна типово", "m:pl:news:setlenv:0"], ["1000 типово", "m:pl:news:setlenv:1000"], ["1500 типово", "m:pl:news:setlenv:1500"]], [["2000 типово", "m:pl:news:setlenv:2000"], ["2100 типово", "m:pl:news:setlenv:2100"], ["2200 типово", "m:pl:news:setlenv:2200"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:rules": {"text": "📜 <b>Правила редакції<\/b>\n\n<b>Базові (завжди діють):<\/b>\nПравила, яких дотримуєшся завжди:\n1. Пишеш літературною українською мовою, нейтрально, без оцінних суджень, емоцій і клікбейту.\n2. Не вигадуєш жодних фактів, цифр, імен, дат, цитат чи місць. Усе, чого немає у вхідному матеріалі, — не пишеш.\n3. Чітко розділяєш підтверджене (є офіційне джерело або пряме посилання) і непідтверджене (лише повідомлення, чутки, один анонімний канал).\n4. Атрибуція: «за даними ОВА», «повідомив голова громади», «як пише канал …». Без атрибуції — лише загальновідомі факти.\n5. Географія — за областями. У зведеннях Київ і Київська область завжди першими, далі за алфавітом.\n6. Загиблих і поранених не рахуєш двічі: якщо одне джерело оновлює інше, береш найновіше число й не додаєш їх.\n7. Не публікуєш точні координати позицій, маршрути руху військ, місця розташування ППО й інші дані, що можуть зашкодити безпеці.\n8. Заголовок — до 110 символів, без крапки в кінці, без лапок-«ялинок» навколо всього заголовка.\n9. Лід (перше речення) відповідає на питання: що сталося, де, коли.\n10. Переписуєш своїми словами: не копіюєш речення джерела дослівно, крім коротких цитат з атрибуцією.\n\n<b>Ваші додаткові:<\/b>\n— немає", "rows": [[["✍️ Задати свої", "m:pl:news:rulesask"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Wt": {"text": "📐 <b>Шаблони написання<\/b>\n\n<b>📱 Соцмережі<\/b>\nПост для соцмереж до 600 символів: перше речення — гачок із головним фактом; 2–4 короткі речення; без клікбейту; в кінці 2–3 хештеги за темою. Посилання на першоджерело — окремим рядком.\n\n<b>📰 Новина<\/b>\nКласична новина: заголовок; лід (що, де, коли, хто); деталі за спаданням важливості; цитата з атрибуцією, якщо є; контекст одним абзацом; що буде далі.\n\n<b>📚 Біг ньюз / стаття<\/b>\nОрганічна велика стаття з кількох джерел: заголовок; лід; 3–5 розділів із підзаголовками (що сталося; що кажуть різні сторони; цифри й факти; контекст і передісторія; що далі); розбіжності між джерелами називати прямо; …\n\n<b>🔁 Оновлення<\/b>\nОновлення до вже опублікованої новини: що нового в першому реченні; що було відомо раніше (коротко, з посиланням на нашу попередню публікацію); що змінилося; що досі не підтверджено.\n\n<b>❌ Спростування<\/b>\nСпростування: що стверджувалося і де; що насправді (лише з підтвердженими джерелами); хто й як це встановив; висновок без емоцій. Якщо доказів спростування немає — так і напиши в notes і skip=true.\n", "rows": [[["✏️ 📱 Соцмережі", "m:pl:news:Wte:short"]], [["✏️ 📰 Новина", "m:pl:news:Wte:news"]], [["✏️ 📚 Біг ньюз / стаття", "m:pl:news:Wte:big"]], [["✏️ 🔁 Оновлення", "m:pl:news:Wte:update"]], [["✏️ ❌ Спростування", "m:pl:news:Wte:refute"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Tp": {"text": "🗂 <b>Теми кнопок пульта<\/b>\n\nКожна тема — кнопка швидкого пошуку й написання. Ключові слова — через кому.\n\n⚔️ Війна: війна, фронт, обстріл, атака, дрон, ракет, ЗСУ, окупант, ППО, загибл, поранен, вибух, евакуац\n\n✨ Астрологія: астролог, гороскоп, знак зодіаку, ретроград, Меркурій, повня, молодик, зодіак, натальн, таро\n\n🐾 Права тварин: тварин, зоозахисн, безпритульн, жорстоке поводження, притулок, догхантер, цирк, зоопарк, собак, кот\n\n🌾 Агро: агро, аграрії, врожай, посівна, фермери, зерно, тваринництво, АПК\n\n⚡️ Енергетика: енергетик, електроенергі, відключення світла, графік, енергосистем, сонячні електростанції, ВДЕ, газ, :nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:6ea29de6": {"text": "<b>🔌 Скринька й команди<\/b>\n\n<b>Бот → головний:<\/b> POST на адресу скриньки з JSON <code>{key, type, text}<\/code>. Типи: alert (тривога — завжди зі сповіщенням), info, report.\n<b>Сигнал «я живий»:<\/b> POST …/hb з <code>{key}<\/code> раз на кілька хвилин. Якщо бот мовчить довше за HEARTBEAT_TIMEOUT — я напишу, що він упав. Разом із сигналом бот може повідомити свою адресу команд <code>cmd_url<\/code>.\n<b>Головний → бот:<\/b> я надсилаю POST на cmd_url з <code>{key, text, type, from, hop}<\/code>. Якщо бот відповідає <code>{\"reply\": \"…\"}<\/code>, відповідь з'являється у «Вхідних».\n<b>Без коду:<\/b> перешліть мені будь-яке повідомлення бота — воно стане подією цього бота.\n<b>Bot-to-bot:<\/b> з травня 2026 Telegram дозволяє ботам писати одне одному в особисті, якщо в обох увімкнено режим у @BotFather.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bkfmt": {"text": "<b>📦 Формати резервної копії<\/b>\n\nМожна вибрати <b>кілька форматів одночасно<\/b>. При створенні копії бот надішле окремий файл кожного вибраного формату.\n\n• <b>ZIP<\/b> — найзручніше для iPhone і ручного перегляду.\n• <b>TAR.GZ<\/b> — універсальний архів для серверів/Linux.\n• <b>DB.GZ<\/b> — компактна технічна копія лише SQLite-бази.", "rows": [[["✅ ZIP", "m:pl:hub:bkfmtog:zip"]], [["▫️ TAR.GZ", "m:pl:hub:bkfmtog:targz"]], [["▫️ DB.GZ", "m:pl:hub:bkfmtog:dbgz"]], [["◀️ Назад", "m:pl:hub:bk"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bkscope": {"text": "<b>🗂 Що включати в копію<\/b>\n\n<b>Дані бота<\/b> — розмови, теки, завдання, нотатки, медіа-метадані та налаштування з SQLite.\n\n<b>Повна копія OrionAI<\/b> — база + доступні на сервері файли коду та документації. <b>Секрети, .env, токени й ключі не додаються.<\/b>\n\nПід час автоматичного відновлення бот відновлює базу даних. Файли коду з повної копії призначені для ручного відновлення через GitHub.", "rows": [[["✅ Лише дані", "m:pl:hub:bkscopev:data"]], [["▫️ Повна копія OrionAI", "m:pl:hub:bkscopev:full"]], [["◀️ Назад", "m:pl:hub:bk"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bkt:file": {"text": "<b>📱 Файлом у чат<\/b>\n\n⏱ Автокопії сюди: <b>⏹ автоматичні копії зупинено<\/b>\n\nБот надсилає копію файлом сюди, у чат. Збережіть її у «Файли» на телефоні — тоді копія буде у вас на пристрої.", "rows": [[["⏱ Розклад копій", "m:pl:hub:bks:file"]], [["✅ Місце ввімкнено", "m:pl:hub:bktog:file"]], [["📱 Надіслати файл зараз", "m:pl:hub:bkgo:file"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bkt:channel": {"text": "<b>📢 Приватний канал Telegram<\/b>\n\n⏱ Автокопії сюди: <b>⏹ автоматичні копії зупинено<\/b>\n\n1. Створіть <b>приватний<\/b> канал у Telegram (наприклад, «Копії бота»).\n2. Додайте цього бота в канал адміністратором з правом публікувати.\n3. Перешліть сюди будь-який допис із каналу — і я його запам'ятаю.\n\nПлюси: без лімітів місця, нічого не треба підключати. Файл до 20 МБ бот зможе й відновити сам.", "rows": [[["⏱ Розклад копій", "m:pl:hub:bks:channel"]], [["✖️ Скасувати", "m:pl:hub:bk"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bkt:gdrive": {"text": "<b>🟢 Google Диск<\/b>\n\n⏱ Автокопії сюди: <b>⏹ автоматичні копії зупинено<\/b>\n\nЩоб підключити Google Диск, власник бота має один раз створити безкоштовний ключ застосунку й додати <code>GDRIVE_CLIENT_ID<\/code> і <code>GDRIVE_CLIENT_SECRET<\/code> у налаштування хостингу, а також <code>PUBLIC_URL<\/code>. Покроково — в інструкції «Резервні копії» в архіві з ботом.", "rows": [[["⏱ Розклад копій", "m:pl:hub:bks:gdrive"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bkt:dropbox": {"text": "<b>🔵 Dropbox<\/b>\n\n⏱ Автокопії сюди: <b>⏹ автоматичні копії зупинено<\/b>\n\nЩоб підключити Dropbox, власник бота має один раз створити безкоштовний ключ застосунку й додати <code>DROPBOX_APP_KEY<\/code> і <code>DROPBOX_APP_SECRET<\/code> у налаштування хостингу, а також <code>PUBLIC_URL<\/code>. Покроково — в інструкції «Резервні копії» в архіві з ботом.", "rows": [[["⏱ Розклад копій", "m:pl:hub:bks:dropbox"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bkt:onedrive": {"text": "<b>🟦 OneDrive<\/b>\n\n⏱ Автокопії сюди: <b>⏹ автоматичні копії зупинено<\/b>\n\nЩоб підключити OneDrive, власник бота має один раз створити безкоштовний ключ застосунку й додати <code>ONEDRIVE_CLIENT_ID<\/code> і <code>ONEDRIVE_CLIENT_SECRET<\/code> у налаштування хостингу, а також <code>PUBLIC_URL<\/code>. Покроково — в інструкції «Резервні копії» в архіві з ботом.", "rows": [[["⏱ Розклад копій", "m:pl:hub:bks:onedrive"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bkrs": {"text": "<b>♻️ Відновлення з копії<\/b>\n\nЗвідки взяти копію?\n\n📱 <b>З телефона:<\/b> просто надішліть файл копії: <code>.zip<\/code>, <code>.tar.gz<\/code>, <code>.db.gz<\/code> або зашифрований <code>.enc<\/code>.\nПеред відновленням я покажу, що в копії, і збережу поточну базу поруч — помилку можна відкотити.\n\n<i>Хмари ще не підключені — підключіть Google Диск, Dropbox або OneDrive у «💾 Резервні копії».<\/i>", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:~:26439b1f": {"text": "<b>🛡 Безпека<\/b>\n\n• Головний бот відповідає лише власнику (ALLOWED_USERS).\n• Токени в базі зашифровані ключем з MANAGER_SECRET. Не змінюйте його, інакше токени доведеться ввести знову.\n• Якщо токен міг потрапити до чужих рук: @BotFather → /revoke → новий токен → у картці бота «🔑 Замінити токен».\n• Увімкніть двоетапну перевірку в Telegram — це захищає і акаунт, і всіх ботів.\n• Резервні копії — у «🧰 Інструменти».", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:hub:bi:bots": {"text": "<b>🎛 🤖 Боти<\/b>\n\nРозділ. Зараз: <b>⌨️ меню внизу<\/b> · 🔒 не можна приховати, щоб не загубити дорогу\n\nКуди поставити:", "rows": [[["● ⌨️ Внизу", "m:pl:hub:bmv:bots:kb"], ["🏠 У «Меню»", "m:pl:hub:bmv:bots:home"]], [["📂 🧰 Інструменти", "m:pl:hub:bmv:bots:g:tools"]], [["⬆️ me"], ["💡", "imp:s"]]]}, "m:pl:news:Ladd:1": {"text": "➕ Вставте посилання — по одному в рядку (можна з назвою й областю через |):", "rows": [[["✖️ Скасувати", "m:cancel"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Lbdel:1": {"text": "🗑 Номери джерел для видалення, наприклад 3, 5-8, 12:", "rows": [[["✖️ Скасувати", "m:cancel"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:ed:1": {"text": "✍️ <b>Що змінити?<\/b>\n\nНапишіть вказівку своїми словами, наприклад: «Переписати лід без оцінок, додати, що дані попередні, заголовок коротший».", "rows": [[["✖️ Скасувати", "m:cancel"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:pubch": {"text": "📤 <b>Підключення каналу<\/b>\n\n1. Додайте бота в канал адміністратором із правом публікації.\n2. Перешліть сюди будь-який допис із цього каналу.", "rows": [[["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Tgadd": {"text": "🏷 Напишіть запит тегу. Можна OR, \"точна фраза\", -мінус-слово. Кілька тегів — кожен з нового рядка.", "rows": [[["✖️ Скасувати", "m:cancel"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Bka:word": {"text": "🚫 🔤 слово / тема — що блокувати? Кілька — через кому.", "rows": [[["✖️ Скасувати", "m:cancel"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Oua": {"text": "➕ Вставте нашу публікацію: посилання першим рядком (необовʼязково), далі текст. Кілька — розділіть рядком «---».", "rows": [[["✖️ Скасувати", "m:cancel"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}, "m:pl:news:Ldelask:1": {"text": "🗑 <b>Видалити список «Області» і всі 10 джерел?<\/b>\nНовини, уже взяті з них, лишаться.", "rows": [[["🗑 Так, видалити", "m:pl:news:Ldel:1"]], [["🏠 Додому", "m:nav:home"], ["💡", "imp:s"]]]}};

<style>
:root{--bg:var(--tg-theme-bg-color,#0f1720);--card:var(--tg-theme-secondary-bg-color,#17212b);--txt:var(--tg-theme-text-color,#eef3f7);

--sep:color-mix(in srgb,var(--hint) 22%,transparent);--danger:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,system-ui,"SF Pro Text",Roboto,sans-serif}
main{padding:14px 16px calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.top{display:flex;align-items:flex-start;gap:10px;margin:4px 0 12px}
.top h1{flex:1;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.4px}
.ic{border:0;background:var(--card);color:var(--txt);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;flex:none}
.ic.on{background:#f5c451;color:#2b2105}.ic.pill{width:auto;padding:0 12px;font-size:14px;font-weight:600}
.sub{color:var(--hint);font-size:14.5px;margin:-4px 0 14px;white-space:pre-wrap}
.card{background:var(--card);border-radius:16px;padding:14px 15px;margin:0 0 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.card b{font-weight:650}.card code{background:color-mix(in srgb,var(--hint) 18%,transparent);padding:0 5px;border-radius:5px;font-size:13.5px}
.card a{color:var(--acc)}
.list{background:var(--card);border-radius:16px;overflow:hidden;margin:0 0 14px}
.cell{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--txt);text-align:left;padding:13px 15px;font:inherit;cursor:pointer;position:relative}
.cell+.cell::before{content:"";position:absolute;left:56px;right:0;top:0;height:1px;background:var(--sep)}
.cell .em{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);font-size:17px;flex:none}
.cell .lb{flex:1;min-width:0}.cell .badge{background:var(--acc);color:var(--acct);border-radius:20px;padding:1px 9px;font-size:13px;font-weight:600}
.cell .chev{color:var(--hint);font-size:18px}.cell.danger{color:var(--danger)}.cell.danger .em{background:color-mix(in srgb,var(--danger) 16%,transparent)}
.cell:active{background:color-mix(in srgb,var(--hint) 12%,transparent)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.seg button{flex:1 1 auto;min-width:0;border:0;border-radius:12px;padding:10px 12px;background:var(--card);color:var(--txt);font:inherit;font-size:14.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.sel{background:var(--acc);color:var(--acct);font-weight:600}
.notes{margin:0 0 14px}.notes div{background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--sep)}
nav button{border:0;background:none;color:var(--hint);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;cursor:pointer;min-width:58px}
nav button span{font-size:21px;filter:grayscale(.6);opacity:.8}nav button.on{color:var(--acc)}nav button.on span{filter:none;opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #0007;transform:translateY(110%);transition:.25s;z-index:5}
.sheet.on{transform:none}.sheet textarea{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);color:var(--txt);padding:10px;font:inherit}
.sheet .row{display:flex;gap:8px;margin-top:10px}.sheet .row button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;cursor:pointer;background:var(--bg);color:var(--txt)}
.sheet .row .pri{background:var(--acc);color:var(--acct);font-weight:650}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-30px);opacity:0;background:var(--card);border-radius:12px;padding:10px 14px;box-shadow:0 6px 20px #0006;transition:.25s;z-index:9;max-width:92vw;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{height:52px;border-radius:14px;background:linear-gradient(90deg,var(--card),color-mix(in srgb,var(--card) 70%,var(--hint)),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
body.marking .cell,body.marking .seg button,body.marking .card{outline:1.5px dashed #f5c451;outline-offset:-2px}
.bub{max-width:86%;padding:9px 12px;border-radius:16px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.bub.user{margin-left:auto;background:var(--acc);color:var(--acct);border-bottom-right-radius:5px}
.bub.assistant{background:var(--card);border-bottom-left-radius:5px}.bub small{display:block;opacity:.65;font-size:11.5px;margin-top:3px}
.composer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px 12px;background:var(--bg);border-top:1px solid var(--sep)}
.composer textarea{flex:1;resize:none;height:42px;max-height:120px;border-radius:21px;border:1px solid var(--sep);background:var(--card);color:var(--txt);padding:10px 14px;font:inherit}
.composer button{border:0;width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--txt);font-size:18px;cursor:pointer;flex:none}
.composer .send{background:var(--acc);color:var(--acct)}
.typing{color:var(--hint);font-size:13px;margin:6px 2px}
.empty{text-align:center;color:var(--hint);padding:50px 10px}
</style>
</head>
<body><div style="position:sticky;top:0;z-index:8;display:flex;gap:8px;align-items:center;padding:8px 14px;background:#f5c451;color:#2b2105;font-size:13px"><button id="demoback" style="visibility:hidden;border:0;background:#2b2105;color:#f5c451;border-radius:8px;padding:4px 10px;cursor:pointer" onclick="Telegram.WebApp.BackButton._f&&Telegram.WebApp.BackButton._f()">‹ Назад</button>🧪 Демо Mini App на знімку справжніх екранів · <a href="sandbox.html" style="color:#2b2105">чат-вигляд</a></div>
<main id="main"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<nav id="tabs"></nav>
<input type="file" id="filein" style="display:none">
<div class="sheet" id="sheet"><div id="sheetq" class="sub" style="margin:0 0 8px"></div><input type="hidden" id="sheetmode"><textarea id="sheett"></textarea>
<div class="row"><button onclick="cancelInput()">Скасувати</button><button id="sheetfile" onclick="pickFile(document.getElementById('sheett').value)">📎 Файл</button><button class="pri" onclick="sendInput()">Готово</button></div></div>
<div class="toast" id="toast"></div>
<script>
const TG = window.Telegram && Telegram.WebApp;
const init = TG && TG.initData;
const API = new URL('app/api', location.href.replace(/app\/?(#.*)?$/, '')).href;
const TABS = [['chat','💬','Розмова'],['m:pl:news','📰','Ньюзрум'],['m:pl:inb','📮','Скринька'],['m:pl:stk','🧷','Стікери'],['m:home','☰','Меню']];
const HASH = {chat:'chat', menu:'m:home', news:'m:pl:news', inbox:'m:pl:inb', stk:'m:pl:stk', lists:'m:pl:news:L', find:'m:pl:news:D'};
let hist = [], cur = null, marking = false, busy = false;

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function haptic(k){try{TG.HapticFeedback.impactOccurred(k||'light')}catch(_){}}
function sanitize(html){
  const d=document.createElement('div');d.innerHTML=html.replace(/\n/g,'<br>');
  (function walk(n){for(const c of [...n.childNodes]){if(c.nodeType===1){const t=c.tagName.toLowerCase();
    if(!['b','strong','i','em','u','s','code','pre','a','br'].includes(t)){c.replaceWith(...c.childNodes);continue}
    for(const a of [...c.attributes]) if(!(t==='a'&&a.name==='href'&&/^https?:/.test(a.value))) c.removeAttribute(a.name);
    if(t==='a'){c.target='_blank';c.onclick=e=>{e.preventDefault();try{TG.openLink(c.href)}catch(_){window.open(c.href)}}}
    walk(c)}}})(d);return d.innerHTML}
function split(label){
  const m=label.match(/^(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*|[●▫️«])\s*/u);
  let icon=m?m[1]:'', rest=m?label.slice(m[0].length):label, badge='';
  const b=rest.match(/\s·\s*(\d+)$/); if(b){badge=b[1];rest=rest.slice(0,b.index)}
  return {icon,rest,badge}}
async function call(op, data, extra){
  if(!init){render({text:'<b>Відкрийте з Telegram</b>\nЗастосунок працює всередині бота: синя кнопка ліворуч від поля вводу або ⚙️ → 📱 Чат і застосунок.',rows:[]},true);return null}
  busy=true;
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({initData:init,op,data},extra||{}))});
    if(r.status===403){render({text:'<b>Немає доступу</b>\nЦей застосунок відкривається лише для учасників бота.\nЯкщо вас запросили — поверніться в чат із ботом і натисніть «✅ Згоден(-на)», потім відкрийте застосунок знову.',rows:[]},true);return null}
    return await r.json()}catch(e){toast('Немає звʼязку з ботом');return null}finally{busy=false}}
async function open_(data, push=true){
  if(busy) return; const res=await call('screen',data); if(!res) return;
  if(!res.text){ if(res.toast) toast(res.toast); for(const n of res.notes||[]) toast(n); return }
  if(push && cur && cur!==data) hist.push(cur); cur=data; render(res); syncBack();
}
async function openChat(push=true){
  if(push && cur && cur!=='chat') hist.push(cur); cur='chat'; syncBack();
  const res=await call('history','chat'); if(!res) return; renderChat(res);
}
function renderChat(res, typing){
  const main=document.getElementById('main'); main.innerHTML='';
  const top=document.createElement('div');top.className='top';top.innerHTML='<h1></h1>';top.querySelector('h1').textContent='💬 '+(res.dialog||'Розмова');
  const chat=document.createElement('button');chat.className='ic pill';chat.textContent='↗ Чат';chat.title='Продовжити в чаті з ботом';chat.onclick=toChat;top.appendChild(chat);main.appendChild(top);
  const sub=document.createElement('div');sub.className='sub';sub.textContent='Та сама розмова, що й у чаті з ботом: пишіть тут або там — історія спільна.';main.appendChild(sub);
  for(const m of res.messages||[]){const b=document.createElement('div');b.className='bub '+(m.role==='user'?'user':'assistant');b.textContent=m.text;
    if(m.provider){const sm=document.createElement('small');sm.textContent=m.provider;b.appendChild(sm)}main.appendChild(b)}
  if(!(res.messages||[]).length){const e=document.createElement('div');e.className='empty';e.textContent='Почніть розмову — напишіть питання, перешліть текст новини або надішліть файл 📎';main.appendChild(e)}
  if(typing){const t=document.createElement('div');t.className='typing';t.textContent='Думаю над відповіддю…';main.appendChild(t)}
  main.style.paddingBottom='160px';
  let c=document.getElementById('composer');
  if(!c){c=document.createElement('div');c.id='composer';c.className='composer';
    c.innerHTML='<button title="Файл або фото">📎</button><textarea placeholder="Повідомлення…"></textarea><button class="send">➤</button>';
    document.body.appendChild(c);c.children[0].onclick=()=>pickFile(null);c.children[2].onclick=say;
    c.children[1].addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();say()}})}
  c.style.display='flex';tabs();window.scrollTo(0,document.body.scrollHeight);
}
async function say(){const ta=document.querySelector('#composer textarea');const t=ta.value.trim();if(!t||busy)return;ta.value='';
  const h=await call('history','chat');if(h){h.messages.push({role:'user',text:t});renderChat(h,true)}
  const res=await call('say','chat',{text:t,user:userInfo()});if(!res)return;showResult(res)}
function showResult(res){
  if(res.text){hist.push('chat');cur=null;render(res);return}   // плагін показав екран (ньюзрум, стікери, імпорт…)
  for(const n of res.notes||[]) if(!(res.replies||[]).length) toast(n);
  openChat(false);
}
function userInfo(){const u=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user)||{};return {name:[u.first_name,u.last_name].filter(Boolean).join(' '),username:u.username||''}}
function pickFile(caption){const f=document.getElementById('filein');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;
  if(file.size>15*1024*1024){toast('Файл більший за 15 МБ — надішліть його в чат');return}
  const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(file)});
  document.getElementById('sheet').classList.remove('on');toast('📎 Надсилаю '+file.name+'…');
  const res=await call('file',cur||'chat',{name:file.name,mime:file.type,b64,text:caption||'',user:userInfo()});if(res)showResult(res)};f.click()}
function syncBack(){try{hist.length?TG.BackButton.show():TG.BackButton.hide()}catch(_){}}
function render(res, bare){
  const main=document.getElementById('main'); main.innerHTML=''; main.style.paddingBottom='';
  const comp=document.getElementById('composer'); if(comp) comp.style.display='none';
  const lines=(res.text||'').split('\n'); const title=lines.shift().replace(/<[^>]+>/g,'').trim();
  let rest=lines.join('\n').replace(/^\n+/,''); let sub='';
  const p=rest.split('\n\n'); if(p.length>1 && p[0].length<160 && !/<b>/.test(p[0])){sub=p.shift();rest=p.join('\n\n')}
  const top=document.createElement('div');top.className='top';top.innerHTML='<h1></h1>';top.querySelector('h1').textContent=title||'OrionAI';
  if(!bare){
    const chat=document.createElement('button');chat.className='ic pill';chat.title='Продовжити цей екран у чаті з ботом';chat.textContent='↗ Чат';chat.onclick=toChat;
    const imp=document.createElement('button');imp.className='ic'+(marking?' on':'');imp.title='Позначити для «Покращити»';imp.textContent='💡';imp.onclick=()=>{marking=!marking;document.body.classList.toggle('marking',marking);imp.classList.toggle('on',marking);if(marking)toast('💡 Торкніться того, що треба покращити')};
    top.append(imp,chat)}
  main.appendChild(top);
  if(sub){const s=document.createElement('div');s.className='sub';s.innerHTML=sanitize(sub);main.appendChild(s)}
  if(rest.trim()){const c=document.createElement('div');c.className='card';c.innerHTML=sanitize(rest.trim());c.onclick=()=>{if(marking)mark('текст екрана','',c.textContent)};main.appendChild(c)}
  for(const n of res.notes||[]){const d=document.createElement('div');d.className='notes';d.innerHTML='<div></div>';d.firstChild.textContent=n;main.appendChild(d)}
  let list=null;
  for(const row of res.rows||[]){
    const segment = row.length>1 && row.every(([t])=>t.length<=24);
    if(segment){list=null;const g=document.createElement('div');g.className='seg';
      for(const [t,d] of row){const b=document.createElement('button');const s=split(t);b.textContent=(t.startsWith('● ')?t.slice(2):t);if(t.startsWith('● '))b.className='sel';b.onclick=()=>press(t,d);g.appendChild(b)}
      main.appendChild(g);continue}
    for(const [t,d] of row){
      if(!list){list=document.createElement('div');list.className='list';main.appendChild(list)}
      const s=split(t);const b=document.createElement('button');b.className='cell'+(/^🗑|видалити/i.test(t)?' danger':'');
      b.innerHTML='<span class="em"></span><span class="lb"></span>'+(s.badge?'<span class="badge"></span>':'')+'<span class="chev">›</span>';
      b.querySelector('.em').textContent=s.icon||'•';b.querySelector('.lb').textContent=s.rest;if(s.badge)b.querySelector('.badge').textContent=s.badge;
      b.onclick=()=>press(t,d);list.appendChild(b)}
    if(row.length>1) list=null;
  }
  if(!(res.rows||[]).length && !rest.trim()){const e=document.createElement('div');e.className='empty';e.textContent='Тут поки порожньо';main.appendChild(e)}
  if(res.toast) toast(res.toast);
  if(res.awaiting) askInput(res.text);
  tabs(); window.scrollTo(0,0);
}
function tabs(){const n=document.getElementById('tabs');n.innerHTML='';
  const active=TABS.find(([d])=>cur&&(cur===d||cur.startsWith(d+':')))||TABS[4];
  for(const tb of TABS){const b=document.createElement('button');b.className=tb===active?'on':'';b.innerHTML='<span>'+tb[1]+'</span>'+tb[2];
    b.onclick=()=>{haptic();hist=[];cur=null;tb[0]==='chat'?openChat(false):open_(tb[0])};n.appendChild(b)}}
function press(label, d){
  if(marking){mark('кнопка «'+label+'»',d,'');return}
  haptic();
  if(d.startsWith('url:')){try{TG.openLink(d.slice(4))}catch(_){window.open(d.slice(4))}return}
  if(d.startsWith('app:')){toast('Ви вже в застосунку');return}
  if(d==='m:cancel'){cancelInput();return}
  open_(d);
}
function askInput(text, mode){document.getElementById('sheetmode').value=mode||'text';document.getElementById('sheetq').innerHTML=sanitize((text||'').split('\n').slice(0,3).join('\n'));document.getElementById('sheett').value='';document.getElementById('sheet').classList.add('on');setTimeout(()=>document.getElementById('sheett').focus(),250)}
async function sendInput(){const t=document.getElementById('sheett').value.trim();
  if(document.getElementById('sheetmode').value==='mark'){document.getElementById('sheet').classList.remove('on');return saveMark(t)}
  if(!t)return;document.getElementById('sheet').classList.remove('on');
  const res=await call('text',cur,{text:t});if(!res)return;if(res.text){render(res)}else{for(const n of res.notes||[])toast(n);if(res.toast)toast(res.toast)}}
async function cancelInput(){const m=document.getElementById('sheetmode').value;document.getElementById('sheet').classList.remove('on');if(m==='mark'){pending=null;return}await call('screen','m:cancel');if(hist.length){open_(hist.pop(),false)}}
async function toChat(){haptic('medium');await call('tochat',(cur&&cur!=='chat')?cur:'m:home');toast('💬 Екран надіслано в чат');setTimeout(()=>{try{TG.close()}catch(_){}} ,350)}
let pending=null;
function mark(target, action, excerpt){
  marking=false;document.body.classList.remove('marking');pending={target,action,excerpt:(excerpt||'').slice(0,300)};
  askInput('<b>💡 Додати в «Покращити»</b>\n'+target.replace(/</g,'&lt;')+'\nЩо не так і що запропонувати? Можна залишити порожнім.','mark');
  document.querySelectorAll('.ic').forEach(b=>b.classList.remove('on'));
}
async function saveMark(note){
  if(!pending)return;const m=Object.assign({where:'app',screen:cur||'',note},pending);pending=null;
  try{const r=await fetch(new URL('improve',API.replace(/app\/api$/,'')).href,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData:init,marks:[m]})});toast(r.ok?'💡 Додано в «Покращити»':'Не вдалося зберегти')}catch(_){toast('Не вдалося зберегти')}
}
if(TG){TG.ready();TG.expand();try{TG.BackButton.onClick(()=>{if(hist.length){const h=hist.pop();h==='chat'?openChat(false):open_(h,false)}})}catch(_){}}
(function start(){
  if(TG && TG.isVersionAtLeast && !TG.isVersionAtLeast('6.1')){
    render({text:'<b>Цей Telegram не підтримує застосунок</b>\nУсе те саме доступне в чаті з ботом кнопками. Оновіть Telegram, щоб користуватись і застосунком.',rows:[]},true);return}
  const first=HASH[(location.hash||'').slice(1)]||(TG&&TG.initDataUnsafe&&HASH[TG.initDataUnsafe.start_param])||'m:pl:news';
  first==='chat'?openChat(false):open_(first,false);
})();
</script>
</body>
