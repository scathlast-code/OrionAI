<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>OrionAI · Стікери</title><style>body{font:16px system-ui;background:#f3f7f5;color:#18362b;padding:16px;margin:0}main{max-width:760px;margin:auto}button,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #277055}button{background:#277055;color:white;cursor:pointer}button:disabled{opacity:.4}input{max-width:220px}section{background:white;padding:14px;margin:12px 0;border-radius:12px}.item{display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd;padding:8px 0}.item span{overflow-wrap:anywhere;flex:1}nav{display:flex;gap:6px;flex-wrap:wrap}small{color:#52685d}</style></head><body><main><h2>OrionAI · Редактор стікерів</h2><p>Відкрий цю сторінку з Telegram Mini App. Введи ID чернетки, отриманий від бота.</p><nav><input id="id" placeholder="ID чернетки"><button id="load">Відкрити</button></nav><p id="status" role="status"></p><section id="panel" hidden><h3 id="heading"></h3><nav id="actions"></nav><div id="items"></div></section></main><script>
const tg=window.Telegram?.WebApp;tg?.ready();const status=document.getElementById('status');const idInput=document.getElementById('id');const panel=document.getElementById('panel');let draft=null;
async function api(path,method='GET',body){if(!tg?.initData)throw Error('Відкрий Mini App усередині Telegram');const r=await fetch(path,{method,headers:{'X-Telegram-Init-Data':tg.initData,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.json()).detail||`HTTP ${r.status}`);return r.json()}
async function load(){try{status.textContent='Завантаження…';draft=await api('/api/stickers/'+encodeURIComponent(idInput.value.trim()));render();status.textContent='Дані оновлено'}catch(e){status.textContent='⚠️ '+e.message}}
function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b}
async function act(path,body){try{draft=await api('/api/stickers/'+encodeURIComponent(idInput.value.trim())+'/'+path,'POST',body);render();status.textContent='Збережено'}catch(e){status.textContent='⚠️ '+e.message}}
function render(){panel.hidden=false;document.getElementById('heading').textContent='Чернетка '+draft.id+' · '+draft.status;const actions=document.getElementById('actions');actions.replaceChildren();if(draft.status==='editing'){actions.append(btn('Обрати всі',()=>act('all',{included:true})),btn('Прибрати всі',()=>act('all',{included:false})),btn('На затвердження',()=>act('submit')))}if(draft.status==='pending')actions.append(btn('Затвердити',()=>act('approve')),btn('Повернути на редагування',()=>act('reject')));const items=document.getElementById('items');items.replaceChildren();let n=0;for(const pack of draft.manifest.packs){const h=document.createElement('h4');h.textContent=pack.title||pack.name;items.append(h);for(const item of pack.items){n++;const row=document.createElement('label');row.className='item';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=!!item.included;checkbox.disabled=draft.status!=='editing'||!!item.duplicate_of;const index=n;checkbox.onchange=()=>act('select',{index,included:checkbox.checked});const name=document.createElement('span');name.textContent=(item.emoji||'')+' '+item.file+(item.duplicate_of?' (дублікат)':'');row.append(checkbox,name);items.append(row)}}}
document.getElementById('load').onclick=load;const params=new URLSearchParams(location.search);if(params.has('draft')){idInput.value=params.get('draft');load()}
</script></body></html>
