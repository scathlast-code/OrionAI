<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrionAI · UTM</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font:16px system-ui;background:#f6f8f7;color:#17382d;margin:0;padding:18px}main{max-width:740px;margin:auto}section{background:white;border-radius:14px;padding:17px;margin:14px 0;box-shadow:0 2px 10px #0001}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #d2dfd7;font:inherit}button{background:#277055;color:white;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}canvas{max-width:100%}small{color:#64736c}.error{color:#a32020}</style><main><h2>🔗 GreenPost · UTM</h2><small>Дані лише з підключеного Short.io. Порожні поля не замінюються вигаданими цифрами.</small><section><h3>Створити повне й коротке посилання</h3><input id="url" placeholder="https://greenpost.ua/news/..." type="url"><input id="tag" placeholder="utm_content (наприклад autumn)"><select id="platform"></select><button onclick="create()">Створити обидва посилання</button><pre id="pair"></pre></section><section><h3>📊 Статистика та діаграми</h3><button onclick="stats()">Оновити статистику</button><div id="metrics"></div><canvas id="chart" width="650" height="280" role="img" aria-label="Діаграма кліків за платформами"></canvas><div id="dimensions"></div></section><section><h3>Імпорт попередніх посилань</h3><button onclick="importLinks()">Імпортувати першу сторінку Short.io</button><small>Повторний імпорт не дублює вже наявні короткі адреси. Для великого архіву потрібна пагінація.</small><pre id="importstatus"></pre></section></main><script>
const init=window.Telegram?.WebApp?.initData||'';window.Telegram?.WebApp?.ready();
const platforms=['telegram','telegram_stories','tumblr','facebook','facebook_stories','facebook_reels','threads','instagram_stories','twitter','youtube_video','youtube_cards','instagram_bio','tiktok_bio','telegram_comments','facebook_comments','twitter_comments'];
platforms.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;document.getElementById('platform').append(o)});
async function api(endpoint,body){if(!init)throw Error('Відкрийте цей екран із Telegram Mini App');const r=await fetch('/api/utm/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,initData:init})});const j=await r.json();if(!r.ok)throw Error(j.detail||'API error');return j}
async function create(){const out=document.getElementById('pair');try{const j=await api('create',{url:document.getElementById('url').value,tag:document.getElementById('tag').value,platform:document.getElementById('platform').value});out.textContent='Повне: '+j.full_url+'\n\nКоротке: '+j.short_url+'\n'+(j.duplicate?'⚠️ Схожа адреса вже створювалася':'')}catch(e){out.textContent='Помилка: '+e.message}}
function barChart(data){const c=document.getElementById('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const entries=Object.entries(data||{}).sort((a,b)=>b[1]-a[1]).slice(0,7);if(!entries.length){ctx.fillStyle='#555';ctx.fillText('Немає підтверджених даних для графіка',12,35);return}const max=Math.max(1,...entries.map(x=>x[1]));entries.forEach(([label,val],i)=>{let y=15+i*37;ctx.fillStyle='#17382d';ctx.fillText(label,8,y+13);ctx.fillStyle='#93D09B';ctx.fillRect(165,y,Math.round(340*val/max),22);ctx.fillStyle='#17382d';ctx.fillText(String(val),515,y+15)})}
async function stats(){const el=document.getElementById('metrics'),dims=document.getElementById('dimensions');try{const j=await api('dashboard',{});el.textContent='Зареєстровано посилань: '+j.links+' · Кліків: '+(j.clicks===null?'немає даних':j.clicks);barChart(j.clicks_by_platform);dims.replaceChildren();for(const [key,value] of Object.entries(j.dimensions||{})){const d=document.createElement('details');const s=document.createElement('summary');s.textContent='📈 '+key;const pre=document.createElement('pre');pre.textContent=JSON.stringify(value,null,2);d.append(s,pre);dims.append(d)}if(j.errors?.length){const p=document.createElement('p');p.className='error';p.textContent='Недоступні показники: '+j.errors.join('; ');dims.append(p)}}catch(e){el.textContent='Помилка: '+e.message;barChart({})}}
async function importLinks(){const el=document.getElementById('importstatus');try{el.textContent=JSON.stringify(await api('import',{}),null,2)}catch(e){el.textContent='Помилка: '+e.message}}
barChart({});
</script></html>
