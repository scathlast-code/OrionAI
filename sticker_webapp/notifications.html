<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrionAI — сповіщення</title><style>body{font:16px system-ui;max-width:650px;margin:24px auto;padding:0 16px;background:#f5f7f6;color:#152923}section{background:white;padding:18px;border-radius:14px;margin:14px 0}button,select,input{padding:9px;margin:6px;border:1px solid #277055;border-radius:8px}button{cursor:pointer}#error{color:#a22}small{color:#566}</style></head><body><h2>OrionAI · Сповіщення</h2><p id="error"></p><section><label>Звук <select id="sound"></select></label><button id="play">▶ Прослухати</button><br><label>Вібрація <select id="vibration"></select></label><button id="vibrate">Випробувати</button><p><small>Звуки працюють лише у відкритому Mini App після взаємодії. Вібрація залежить від браузера й пристрою. Telegram push не змінюється.</small></p></section><section id="admin" hidden><h3>Адміністратор</h3><label><input type="checkbox" id="quiet">Тиха година</label><input type="time" id="start" value="23:00"><input type="time" id="end" value="08:00"><button id="saveQuiet">Зберегти</button><hr><label><input type="checkbox" id="sleep">Глибокий сон</label><button id="saveSleep">Застосувати</button><p><small>Глибокий сон блокує API стікерів і Telegram-запити, але не зупиняє сторонні фонові процеси.</small></p></section><script>
const tg=window.Telegram?.WebApp;tg?.ready();const init=tg?.initData||'';const err=document.querySelector('#error');
async function api(path,body){const r=await fetch('/api/notifications'+path,{method:body?'POST':'GET',headers:{'X-Telegram-Init-Data':init,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.json()).detail||r.status);return r.json()}
const patterns={short:[100],double:[100,100,100],triple:[90,90,90,90,90],long:[400],sos:[100,90,100,90,100,150,350,100,350,100,350,150,100,90,100,90,100]};
const tones={soft:[440],double:[520,650],melody:[440,554,659],urgent:[880,880,880],low:[220]};
function play(){const C=window.AudioContext||window.webkitAudioContext;if(!C){err.textContent='Аудіо не підтримується';return}const c=new C();const seq=tones[document.querySelector('#sound').value]||tones.soft;seq.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime+i*.19);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+i*.19+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.19+.16);o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.19);o.stop(c.currentTime+i*.19+.17)});setTimeout(()=>c.close(),seq.length*200+300)}
function vibrate(){const p=patterns[document.querySelector('#vibration').value];if(navigator.vibrate){navigator.vibrate(p)}else if(tg?.HapticFeedback){tg.HapticFeedback.notificationOccurred('success')}else err.textContent='Вібрація недоступна на цьому пристрої'}
async function initPage(){try{const d=await api('');for(const [id,items] of [['sound',d.sounds],['vibration',d.vibrations]]){const el=document.getElementById(id);items.forEach(x=>el.add(new Option(x,x)));el.value=d.user[id]}if(d.admin){document.querySelector('#admin').hidden=false;document.querySelector('#quiet').checked=!!d.bot.quiet_enabled;document.querySelector('#start').value=d.bot.quiet_start;document.querySelector('#end').value=d.bot.quiet_end;document.querySelector('#sleep').checked=!!d.bot.deep_sleep}}catch(e){err.textContent='Не вдалося завантажити налаштування: '+e.message}}
for(const kind of ['sound','vibration'])document.getElementById(kind).onchange=async e=>{try{await api('/choice',{kind,value:e.target.value});err.textContent='Збережено'}catch(x){err.textContent=x.message}};
document.querySelector('#play').onclick=play;document.querySelector('#vibrate').onclick=vibrate;
document.querySelector('#saveQuiet').onclick=async()=>{try{await api('/quiet',{enabled:document.querySelector('#quiet').checked,start:document.querySelector('#start').value,end:document.querySelector('#end').value});err.textContent='Тиху годину збережено'}catch(e){err.textContent=e.message}};
document.querySelector('#saveSleep').onclick=async()=>{try{await api('/sleep',{enabled:document.querySelector('#sleep').checked});err.textContent='Режим збережено'}catch(e){err.textContent=e.message}};initPage();</script></body></html>
