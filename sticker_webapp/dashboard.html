<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d22"><title>OrionAI · Простір</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e9f2ef;background:#101d22;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #a2dfb9;outline-offset:3px}.app{max-width:1120px;margin:auto;min-height:100dvh;display:grid;grid-template-columns:230px 1fr}.rail{background:#14252a;padding:26px 14px;border-right:1px solid #2d4649}.brand{font-weight:850;letter-spacing:-.6px;font-size:25px;padding:6px 12px 30px}.brand span{color:#94d7af}.nav{display:grid;gap:7px}.nav button{background:none;color:#bdd1cb;border:0;text-align:left;padding:12px 13px;border-radius:13px}.nav button.active{background:#24483f;color:white;font-weight:700}.main{padding:28px clamp(16px,4vw,46px) 110px;min-width:0}.eyebrow{color:#9bbab0;font-size:12px;text-transform:uppercase;letter-spacing:1.5px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.heading h1{font-size:clamp(26px,4vw,39px);letter-spacing:-1.2px;margin:7px 0 8px}.sub{color:#9db8b1;line-height:1.5;margin:0 0 24px}.chip{border:1px solid #385b55;background:#1c3335;border-radius:30px;padding:8px 12px;color:#bde2d0;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#1b3033;border:1px solid #315052;border-radius:20px;padding:20px;min-width:0}.card h2{font-size:18px;margin:8px 0}.card p{color:#a7c1b8;font-size:13px;line-height:1.55}.card .symbol{font-size:26px}.card button,.primary{background:#9bdfb8;color:#103127;border:0;padding:10px 15px;border-radius:11px;font-weight:750}.card button.secondary,.secondary{background:#294a49;color:#e3f4ed;border:1px solid #4b7067}.wide{grid-column:1/-1}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.stack{display:grid;gap:14px}.field{display:grid;gap:6px;color:#bed2cb;font-size:13px}.field select,.field input{padding:11px;border-radius:10px;border:1px solid #42605c;background:#13292c;color:white;min-width:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.muted{color:#9bb4ae;font-size:13px}.notice{background:#283e37;border:1px solid #52775d;border-radius:13px;padding:13px;line-height:1.5}.status{min-height:22px;color:#a8dfbd}.bottom{display:none}.hide{display:none!important}a{color:#b6eec9}.divider{border-top:1px solid #345054;margin:12px 0}.mini{font-size:12px;color:#b4d0c5} @media(max-width:720px){.app{display:block}.rail{display:none}.main{padding:20px 16px 105px}.grid{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#14272a;border-top:1px solid #385554;padding:9px 6px max(10px,env(safe-area-inset-bottom));z-index:5}.bottom button{border:0;background:none;color:#a6c6b9;font-size:11px;padding:7px 2px}.bottom button.active{color:#c0f4cf;font-weight:800}.bottom b{display:block;font-size:20px;margin-bottom:4px}}@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style></head><body><div class="app"><aside class="rail"><div class="brand">✦ Orion<span>AI</span></div><div class="nav" id="side"></div></aside><main class="main"><div class="eyebrow">Особистий простір · OrionAI</div><div class="heading"><h1 id="title">Огляд</h1><span class="chip" id="connection">● Перевірка</span></div><p class="sub" id="subtitle">Усе важливе під рукою, решта — за потреби.</p><div id="content"></div><p class="status" id="status" role="status" aria-live="polite"></p></main></div><nav class="bottom" id="bottom" aria-label="Основна навігація"></nav><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const pages=[['home','⌂','Огляд'],['work','✧','Робота'],['stickers','▦','Стікери'],['settings','⚙','Режими'],['more','☷','Ще']];let page='home';let data=null;const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const status=s=>el('status').textContent=s;
async function api(path,method='GET',body){if(!tg?.initData)throw Error('Для персональних налаштувань відкрийте Mini App із Telegram');const r=await fetch(path,{method,headers:{'X-Telegram-Init-Data':tg.initData,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||`HTTP ${r.status}`);return d}
function go(id){page=id;history.replaceState(null,'','#'+id);document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===id);b.setAttribute('aria-current',b.dataset.page===id?'page':'false')});el('title').textContent=pages.find(p=>p[0]===id)[2];el('subtitle').textContent=({home:'Швидкий доступ без десятків кнопок.',work:'Оберіть потрібну дію, а не команду.',stickers:'Пакети, добірки та погодження.',settings:'Звуки, тиша та сон у одному місці.',more:'Інструменти й довідки, які не заважають щодня.'})[id];render()}
function card(icon,title,desc,action,label='Відкрити'){return `<article class="card"><div class="symbol">${icon}</div><h2>${title}</h2><p>${desc}</p><button data-action="${action}">${label}</button></article>`}
function render(){let c='';if(page==='scenarios')c=`<div class="card stack"><h2>Сценарії поведінки</h2><p>Кожен сценарій можна увімкнути або вимкнути незалежно. Налаштування зберігаються на сервері.</p><div id="scenarioList">Завантаження…</div></div>`;if(page==='home')c=`<div class="grid">${card('✧','Почати роботу','Пошук, тексти, файли й завдання в одному просторі.','work')}${card('▦','Стікери та емодзі','Вибір, вилучення та погодження пакетів.','stickers')}${card('☾','Тиха година','Змінити режим сповіщень і сну.','settings')}${card('☷','Інструменти','Довідники, ресурси й додаткові можливості.','more')}</div>`;
if(page==='work')c=`<div class="grid">${card('✍','Тексти та ШІ','Діалог залишається в Telegram; Mini App відкриває спеціалізовані інструменти.','chat','Відкрити чат')}${card('▦','Редактор стікерів','Створюйте добірки й надсилайте їх на погодження.','stickers')}${card('◫','Файли та архіви','Передайте файли в чат OrionAI для обробки.','chat','Перейти в чат')}${card('◎','Перевірка і ресурси','Доступні серверні команди /resources та /diagnostics.','chat','Перейти в чат')}</div>`;
if(page==='stickers')c=`<div class="card stack"><h2>Відкрити добірку</h2><p>Введіть ID чернетки, отриманий у Telegram. Редактор покаже фактичні елементи з сервера.</p><label class="field">ID чернетки<input id="draft" autocomplete="off" placeholder="Наприклад, 9d2a..."></label><div class="toolbar"><button class="primary" data-action="draft">Редагувати добірку</button><button class="secondary" data-action="chat">Повернутися до бота</button></div><div class="mini">Вибір та погодження виконуються через захищений API, а не демонстраційні дані.</div></div>`;
if(page==='settings')c=`<div class="stack"><div class="card stack"><h2>Особисті сповіщення</h2><label class="field">Звук<select id="sound">${[1,2,3,4,5].map(x=>`<option value="${x}">Профіль ${x}</option>`).join('')}</select></label><label class="field">Вібрація<select id="vibration">${[1,2,3,4,5].map(x=>`<option value="${x}">Профіль ${x}</option>`).join('')}</select></label><div class="toolbar"><button data-action="save">Зберегти</button><button class="secondary" data-action="preview">Перевірити звук</button></div><p class="muted">Звук доступний, поки Mini App відкритий. Вібрація залежить від пристрою; Telegram push-сповіщення мають власні налаштування.</p></div><div class="card stack" id="adminCard"><h2>Режими бота</h2><p>Тиха година не зупиняє завдання. Глибокий сон блокує нові звичайні запити; повна зупинка всіх фонових процесів ще не реалізована.</p><div id="adminFields" class="stack"><span class="muted">Завантаження…</span></div></div></div>`;
if(page==='more')c=`<div class="grid">${card('▤','Конструктор інтерфейсу','Блоки, кнопки, порядок і видимість.','builder')}${card('⚙','Сценарії поведінки','Незалежні профілі, які можна вимкнути одним натисканням.','scenarios')}${card('♫','Повні налаштування звуку','Існуючий екран з додатковими параметрами.','notifications')}${card('◈','Довідка','Команди /help і /formats доступні в Telegram.','chat','Відкрити бота')}${card('⛨','Діагностика','Перевірка помилок через /diagnostics.','chat','Відкрити бота')}${card('↗','Панель ресурсів','Існуюча сторінка показників і посилань.','resources')}</div>`;
el('content').innerHTML=c;el('content').querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));if(page==='settings')loadSettings();if(page==='scenarios')loadScenarios()}
async function loadSettings(){try{data=await api('/api/notifications');el('connection').textContent='● Підключено';const sound=el('sound'),vib=el('vibration');const names=Array.from(data.sounds||[]),vnames=Array.from(data.vibrations||[]);if(names.length)sound.innerHTML=names.map((x,i)=>`<option value="${esc(x)}">${i+1}. ${esc(x)}</option>`).join('');if(vnames.length)vib.innerHTML=vnames.map((x,i)=>`<option value="${esc(x)}">${i+1}. ${esc(x)}</option>`).join('');const u=data.user||{};if(u.sound!==undefined)sound.value=String(u.sound);if(u.vibration!==undefined)vib.value=String(u.vibration);el('adminCard').classList.toggle('hide',!data.admin);if(data.admin){const b=data.bot||{};el('adminFields').innerHTML=`<label class="field">Тиха година<select id="quiet"><option value="false">Вимкнено</option><option value="true">Увімкнено</option></select></label><div class="toolbar"><label class="field">Початок<input type="time" id="start" value="${esc(b.quiet_start||'23:00')}"></label><label class="field">Кінець<input type="time" id="end" value="${esc(b.quiet_end||'08:00')}"></label></div><div class="toolbar"><button data-action="quiet">Зберегти тиху годину</button><button class="secondary" data-action="sleep">${b.deep_sleep?'Пробудити OrionAI':'Увімкнути глибокий сон'}</button></div>`;el('quiet').value=String(!!b.quiet_enabled);el('adminFields').querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>action(x.dataset.action))}}catch(e){el('connection').textContent='● Без з’єднання';status('⚠ '+e.message);el('adminCard')?.classList.add('hide')}}
async function loadScenarios(){try{const d=await api('/api/scenarios');el('scenarioList').innerHTML=d.items.map(x=>`<label class="row divider" style="padding:12px 0"><span><strong>${esc(x.title)}</strong><br><small class="muted">${esc(x.description)}</small></span><input type="checkbox" data-scenario="${esc(x.id)}" ${x.enabled?'checked':''} aria-label="${esc(x.title)}"></label>`).join('');el('scenarioList').querySelectorAll('[data-scenario]').forEach(x=>x.addEventListener('change',async()=>{try{await api('/api/scenarios/'+x.dataset.scenario,'POST',{enabled:x.checked});status('✓ Сценарій збережено')}catch(e){x.checked=!x.checked;status('⚠ '+e.message)}}))}catch(e){el('scenarioList').textContent='⚠ '+e.message}}
async function action(a){try{status('');if(pages.some(p=>p[0]===a)){go(a);return}if(a==='scenarios'){page='scenarios';el('title').textContent='Сценарії';el('subtitle').textContent='Увімкніть лише те, що потрібно';render();return}if(a==='draft'){const id=el('draft').value.trim();if(!/^[\w-]{1,100}$/.test(id))throw Error('Введіть коректний ID чернетки');location.href='/index.html?draft='+encodeURIComponent(id);return}if(a==='chat'){tg?.close();status('Поверніться до чату OrionAI в Telegram');return}if(a==='builder'){location.href='/builder.html';return}if(a==='notifications'){location.href='/notifications.html';return}if(a==='resources'){status('Панель ресурсів доступна командою /resources у Telegram.');return}if(a==='save'){await api('/api/notifications/choice','POST',{kind:'sound',value:el('sound').value});await api('/api/notifications/choice','POST',{kind:'vibration',value:el('vibration').value});status('✓ Налаштування збережено');return}if(a==='preview'){const ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=440;o.connect(g);g.connect(ctx.destination);g.gain.value=.05;o.start();o.stop(ctx.currentTime+.13);setTimeout(()=>ctx.close(),250);if(navigator.vibrate)navigator.vibrate(100);status('Відтворено тестовий сигнал, якщо пристрій дозволяє');return}if(a==='quiet'){await api('/api/notifications/quiet','POST',{enabled:el('quiet').value==='true',start:el('start').value,end:el('end').value,timezone:'Europe/Kyiv'});status('✓ Тиху годину збережено');return}if(a==='sleep'){const next=!(data?.bot?.deep_sleep);if(next&&!confirm('Призупинити звичайні запити OrionAI?'))return;await api('/api/notifications/sleep','POST',{enabled:next});status(next?'Глибокий сон увімкнено':'OrionAI пробуджено');loadSettings();return}}catch(e){status('⚠ '+e.message)}}
for(const [id,icon,label] of pages){for(const root of ['side','bottom']){const b=document.createElement('button');b.dataset.page=id;b.innerHTML=root==='bottom'?`<b>${icon}</b>${label}`:`${icon} &nbsp; ${label}`;b.onclick=()=>go(id);el(root).append(b)}}go(pages.some(p=>p[0]===location.hash.slice(1))?location.hash.slice(1):'home');el('connection').textContent=tg?.initData?'● Telegram':'● Потрібен Telegram';
</script></body></html>
