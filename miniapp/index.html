<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OrionAI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#0f1720);--card:var(--tg-theme-secondary-bg-color,#17212b);--txt:var(--tg-theme-text-color,#eef3f7);
--hint:var(--tg-theme-hint-color,#8b9aa8);--acc:var(--tg-theme-button-color,#5aa9ff);--acct:var(--tg-theme-button-text-color,#fff);
--sep:color-mix(in srgb,var(--hint) 22%,transparent);--danger:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,system-ui,"SF Pro Text",Roboto,sans-serif}
main{padding:14px 16px calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.top{display:flex;align-items:flex-start;gap:10px;margin:4px 0 12px}
.top h1{flex:1;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.4px}
.ic{border:0;background:var(--card);color:var(--txt);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;flex:none}
.ic.on{background:#f5c451;color:#2b2105}.ic.pill{width:auto;padding:0 12px;font-size:14px;font-weight:600}
.sub{color:var(--hint);font-size:14.5px;margin:-4px 0 14px;white-space:pre-wrap}
.card{background:var(--card);border-radius:16px;padding:14px 15px;margin:0 0 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.card b{font-weight:650}.card code{background:color-mix(in srgb,var(--hint) 18%,transparent);padding:0 5px;border-radius:5px;font-size:13.5px}
.card a{color:var(--acc)}
.list{background:var(--card);border-radius:16px;overflow:hidden;margin:0 0 14px}
.cell{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--txt);text-align:left;padding:13px 15px;font:inherit;cursor:pointer;position:relative}
.cell+.cell::before{content:"";position:absolute;left:56px;right:0;top:0;height:1px;background:var(--sep)}
.cell .em{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);font-size:17px;flex:none}
.cell .lb{flex:1;min-width:0}.cell .badge{background:var(--acc);color:var(--acct);border-radius:20px;padding:1px 9px;font-size:13px;font-weight:600}
.cell .chev{color:var(--hint);font-size:18px}.cell.danger{color:var(--danger)}.cell.danger .em{background:color-mix(in srgb,var(--danger) 16%,transparent)}
.cell:active{background:color-mix(in srgb,var(--hint) 12%,transparent)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.seg button{flex:1 1 auto;min-width:0;border:0;border-radius:12px;padding:10px 12px;background:var(--card);color:var(--txt);font:inherit;font-size:14.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.sel{background:var(--acc);color:var(--acct);font-weight:600}
.notes{margin:0 0 14px}.notes div{background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--sep)}
nav button{max-width:20%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;color:var(--hint);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;cursor:pointer;min-width:58px}
nav button span{font-size:21px;filter:grayscale(.6);opacity:.8}nav button.on{color:var(--acc)}nav button.on span{filter:none;opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #0007;transform:translateY(110%);transition:.25s;z-index:5}
.sheet.on{transform:none}.sheet textarea{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);color:var(--txt);padding:10px;font:inherit}
.sheet .row{display:flex;gap:8px;margin-top:10px}.sheet .row button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;cursor:pointer;background:var(--bg);color:var(--txt)}
.sheet .row .pri{background:var(--acc);color:var(--acct);font-weight:650}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-30px);opacity:0;background:var(--card);border-radius:12px;padding:10px 14px;box-shadow:0 6px 20px #0006;transition:.25s;z-index:9;max-width:92vw;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{height:52px;border-radius:14px;background:linear-gradient(90deg,var(--card),color-mix(in srgb,var(--card) 70%,var(--hint)),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
body.marking .cell,body.marking .seg button,body.marking .card{outline:1.5px dashed #f5c451;outline-offset:-2px}
.bub{max-width:86%;padding:9px 12px;border-radius:16px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.arow{display:flex;gap:8px;align-items:flex-end;margin:6px 0}.arow .bub{margin:0}
.ava{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.mbar{position:fixed;left:0;right:0;bottom:calc(116px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;padding:6px 12px;background:var(--bg);z-index:5}.mbar button{flex:none;border:0;border-radius:16px;padding:6px 12px;background:var(--card);color:var(--txt);font:inherit;font-size:13.5px}.mbar button.on{background:var(--acc);color:var(--acct);font-weight:600}
.switch{text-align:center;margin:10px 0}.switch span{display:inline-block;font-size:12px;color:var(--hint);background:var(--card);border-radius:12px;padding:4px 10px}
.bub.user{margin-left:auto;background:var(--acc);color:var(--acct);border-bottom-right-radius:5px}
.bub.assistant{background:var(--card);border-bottom-left-radius:5px}.bub b{font-weight:650}.bub a{color:var(--acc)}.bub pre{white-space:pre-wrap;background:color-mix(in srgb,var(--hint) 14%,transparent);padding:8px;border-radius:8px;font-size:13px}.bub small{display:block;opacity:.65;font-size:11.5px;margin-top:3px}
.composer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px 12px;background:var(--bg);border-top:1px solid var(--sep)}
.composer textarea{flex:1;resize:none;height:42px;max-height:120px;border-radius:21px;border:1px solid var(--sep);background:var(--card);color:var(--txt);padding:10px 14px;font:inherit}
.composer button{border:0;width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--txt);font-size:18px;cursor:pointer;flex:none}
.composer .send{background:var(--acc);color:var(--acct)}
.typing{display:inline-block;color:var(--hint);font-size:12.5px;margin:6px 0;padding:6px 11px;border-radius:14px;background:var(--card);white-space:pre-wrap;max-width:86%}
.seg .sel .bh{color:inherit;opacity:.8}.bh{display:block;color:var(--hint);font-size:11px;line-height:1.2;margin-top:2px;font-weight:400;white-space:normal;overflow:hidden}.rowhint{color:var(--hint);font-size:11px;line-height:1.25;margin:-9px 6px 12px}.seg button{white-space:normal;flex:1 1 0}
.fold{margin:0 0 10px}.foldh{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;background:none;color:var(--txt);font:inherit;font-weight:650;font-size:16px;padding:8px 4px;cursor:pointer}
.foldh i{font-style:normal;color:var(--hint);transition:.2s}.fold.shut .foldh i{transform:rotate(-90deg)}.fold.shut .foldb{display:none}
.empty{text-align:center;color:var(--hint);padding:50px 10px}
.search{width:100%;border:0;border-radius:12px;background:var(--card);color:var(--txt);padding:11px 14px;font:inherit;margin:0 0 14px}
.sec{color:var(--hint);font-size:13px;text-transform:uppercase;letter-spacing:.4px;margin:18px 4px 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 6px}
.tile{position:relative;border:0;background:var(--card);color:var(--txt);border-radius:14px;padding:12px 22px 12px 12px;display:flex;align-items:center;gap:10px;font:inherit;font-size:14.5px;text-align:left;cursor:pointer;min-height:54px}
.tile .em{font-size:20px;flex:none}.tile .tx{flex:1;min-width:0}.tile small{display:block;color:var(--hint);font-size:11.5px;line-height:1.2;margin-top:2px;overflow:hidden}.tile .q{position:absolute;top:4px;right:6px;color:var(--hint);font-size:13px;padding:2px 4px}.tile:active{transform:scale(.97);background:color-mix(in srgb,var(--hint) 14%,var(--card))}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 4px}
.info button{border:0;background:var(--card);color:var(--txt);border-radius:14px;padding:10px;font:inherit;text-align:left;cursor:pointer;min-width:0}
.tile.pick{outline:2px solid var(--acc);outline-offset:-2px}.tile .num{position:absolute;top:6px;right:6px;background:var(--acc);color:var(--acct);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700}
.edit{display:flex;gap:8px;margin:-6px 0 4px}.edit button{flex:1;border:0;border-radius:12px;padding:10px;font:inherit;font-size:14.5px;background:var(--card);color:var(--txt);cursor:pointer}.edit .pri{background:var(--acc);color:var(--acct);font-weight:650}
.info small{display:block;color:var(--hint);font-size:12px}.info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<main id="main"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<nav id="tabs"></nav>
<input type="file" id="filein" style="display:none">
<div class="sheet" id="sheet"><div id="sheetq" class="sub" style="margin:0 0 8px"></div><input type="hidden" id="sheetmode"><textarea id="sheett"></textarea>
<div class="row"><button onclick="cancelInput()">Скасувати</button><button id="sheetfile" onclick="pickFile(document.getElementById('sheett').value)">📎 Файл</button><button class="pri" onclick="sendInput()">Готово</button></div></div>
<div class="toast" id="toast"></div>
<script>
const TG = window.Telegram && Telegram.WebApp;
const init = TG && TG.initData;
const API = new URL('app/api', location.href.replace(/app\/?(#.*)?$/, '')).href;
const MENU_TAB = ['menu','☰','Меню','menu'];
let TABS = [['chat','💬','Розмова','chat'],['m:pl:news','📰','Ньюзрум','news'],['m:pl:inb','📮','Скринька','inbox'],['m:pl:stk','🧷','Стікери','stk']];
try{const t=JSON.parse(localStorage.getItem('orion_tabs')||'null');if(Array.isArray(t))TABS=t}catch(_){}
let editTabs = null;
function setTabs(list){if(!Array.isArray(list))return;TABS=list.map(t=>{const sp=split(t.label);return [t.data,sp.icon||'•',sp.rest,t.key]});
  try{localStorage.setItem('orion_tabs',JSON.stringify(TABS))}catch(_){} tabs()}
const HASH = {chat:'chat', menu:'menu', news:'m:pl:news', inbox:'m:pl:inb', stk:'m:pl:stk', lists:'m:pl:news:L', find:'m:pl:news:D'};
let hist = [], cur = null, curView = true, curTitle = '', marking = false, busy = false, seq = 0, menuCache = null;
const titleOf = t => ((t||'').split('\n').find(l=>/<b>/.test(l))||(t||'').split('\n')[0]||'').replace(/<[^>]+>/g,'').trim();

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function haptic(k){try{TG.HapticFeedback.impactOccurred(k||'light')}catch(_){}}
function sanitize(html){
  const d=document.createElement('div');d.innerHTML=html.replace(/\n/g,'<br>');
  (function walk(n){for(const c of [...n.childNodes]){if(c.nodeType===1){const t=c.tagName.toLowerCase();
    if(!['b','strong','i','em','u','s','code','pre','a','br'].includes(t)){c.replaceWith(...c.childNodes);continue}
    for(const a of [...c.attributes]) if(!(t==='a'&&a.name==='href'&&/^https?:/.test(a.value))) c.removeAttribute(a.name);
    if(t==='a'){c.target='_blank';c.onclick=e=>{e.preventDefault();try{TG.openLink(c.href)}catch(_){window.open(c.href)}}}
    walk(c)}}})(d);return d.innerHTML}
function split(label){
  const m=label.match(/^(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*|[●▫️«])\s*/u);
  let icon=m?m[1]:'', rest=m?label.slice(m[0].length):label, badge='';
  const b=rest.match(/\s·\s*(\d+)$/); if(b){badge=b[1];rest=rest.slice(0,b.index)}
  return {icon,rest,badge}}
async function call(op, data, extra){
  if(!init){render({text:'<b>Відкрийте з Telegram</b>\nЗастосунок працює всередині бота: синя кнопка ліворуч від поля вводу або ⚙️ → 📱 Чат і застосунок.',rows:[]},true);return null}
  busy=true;
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({initData:init,op,data},extra||{}))});
    if(r.status===403){render({text:'<b>Немає доступу</b>\nЦей застосунок відкривається лише для учасників бота.\nЯкщо вас запросили — поверніться в чат із ботом і натисніть «✅ Згоден(-на)», потім відкрийте застосунок знову.',rows:[]},true);return null}
    if(!r.ok){toast('Помилка API: HTTP '+r.status);return null}
    return await r.json()}catch(e){toast(e instanceof SyntaxError?'Некоректна відповідь сервера':'Сервер API недоступний');return null}finally{busy=false}}
function loading(){const m=document.getElementById('main');m.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';const c=document.getElementById('composer');if(c)c.style.display='none';const mb=document.getElementById('mbar');if(mb)mb.remove()}
async function open_(data, push=true){
  if(data==='m:home'||data==='m:nav:home') return openMenu(push);
  // «Назад» веде на попередній ЕКРАН, а не на попереднє налаштування: вибір на тому самому екрані історію не множить,
  // а дії (перемикачі, вибір моделі) ніколи не повторюються при поверненні.
  const my=++seq; const t=setTimeout(()=>{if(my===seq)loading()},350);
  const res=await call('screen',data); clearTimeout(t); if(my!==seq||!res) return;
  if(!res.text){ if(res.toast) toast(res.toast); for(const n of res.notes||[]) toast(n); return }
  const title=titleOf(res.text), same=!!cur && title===curTitle;
  if(!same){ if(push && cur && curView && cur!==data) hist.push(cur); cur=data; curView=!!res.view }
  else if(res.view){ cur=data; curView=true }
  curTitle=title; syncBack();
  render(res);
}
async function openChat(push=true){
  const my=++seq; if(push && cur && curView && cur!=='chat') hist.push(cur); cur='chat'; curView=true; curTitle='💬'; syncBack();
  const res=await call('history','chat'); if(my!==seq||!res) return; renderChat(res);
}
function renderChat(res, typing){
  const main=document.getElementById('main'); main.innerHTML='';
  const top=document.createElement('div');top.className='top';top.innerHTML='<h1></h1>';top.querySelector('h1').textContent='💬 '+(res.dialog||'Розмова');
  const chat=document.createElement('button');chat.className='ic pill';chat.textContent='↗ Чат-бот';chat.title='Продовжити в чаті з ботом';chat.onclick=toChat;top.appendChild(chat);main.appendChild(top);
  const sub=document.createElement('div');sub.className='sub';sub.textContent=res.limits?('📊 '+res.limits):'Та сама розмова, що й у чаті з ботом: пишіть тут або там — історія спільна.';main.appendChild(sub);
  let lastProv='';
  for(const m of res.messages||[]){const b=document.createElement('div');b.className='bub '+(m.role==='user'?'user':'assistant');
    if(m.role==='user')b.textContent=m.text;else b.innerHTML=sanitize(mdHtml(m.text));
    if(m.role!=='user'){
      const pv=m.provider||'';
      if(lastProv&&pv&&pv!==lastProv){const sw=document.createElement('div');sw.className='switch';sw.innerHTML='<span></span>';
        sw.firstChild.textContent='↪️ Тепер відповідає '+avatar(pv).name+' (замість '+avatar(lastProv).name+')';main.appendChild(sw)}
      if(pv) lastProv=pv;
      const a=avatar(pv);if(pv){const sm=document.createElement('small');sm.textContent=a.name;b.appendChild(sm)}
      const row=document.createElement('div');row.className='arow';const av=document.createElement('div');av.className='ava';av.style.background=a.color;av.textContent=a.icon;av.title=a.name;
      row.append(av,b);main.appendChild(row)}
    else main.appendChild(b)}
  if(!(res.messages||[]).length){const e=document.createElement('div');e.className='empty';e.textContent='Почніть розмову — напишіть питання, перешліть текст новини або надішліть файл 📎';main.appendChild(e)}
  if(res.models&&res.models.length>1){ // хто відповідає — перемикання прямо в розмові
    const bar=document.createElement('div');bar.className='mbar';
    for(const m of res.models){const b=document.createElement('button');b.textContent=m.title;if(m.on)b.className='on';
      b.onclick=async()=>{haptic();await call('screen',m.id==='auto'?'m:mmode:all':'m:pick:'+m.id);toast('Відповідає: '+m.title);const h=await call('history','chat');if(h)renderChat(h)};bar.appendChild(b)}
    const old=document.getElementById('mbar');if(old)old.remove();bar.id='mbar';document.body.appendChild(bar)}
  if(typing){const t=document.createElement('div');t.className='typing';t.id='typing';t.textContent='Думаю над відповіддю…';main.appendChild(t)}
  main.style.paddingBottom='200px';
  let c=document.getElementById('composer');
  if(!c){c=document.createElement('div');c.id='composer';c.className='composer';
    c.innerHTML='<button title="Файл або фото">📎</button><textarea placeholder="Повідомлення…"></textarea><button class="send">➤</button>';
    document.body.appendChild(c);c.children[0].onclick=()=>pickFile(null);c.children[2].onclick=say;
    c.children[1].addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();say()}})}
  c.style.display='flex';tabs();window.scrollTo(0,document.body.scrollHeight);
}
async function say(){const ta=document.querySelector('#composer textarea');const t=ta.value.trim();if(!t||busy)return;ta.value='';
  const h=await call('history','chat');if(h){h.messages.push({role:'user',text:t});renderChat(h,true)}
  const tick=setInterval(async()=>{const p=await call('progress','chat');const el=document.getElementById('typing');if(!el||!p||!p.title)return;
    el.textContent='🤖 '+p.title+' ('+p.model+') думає · '+p.sec+' с з '+p.limit+(p.of>1?' · спроба '+p.try+' з '+p.of:'')+(p.prev?'\n↪️ '+p.prev:'')},1000);
  const res=await call('say','chat',{text:t,user:userInfo()});clearInterval(tick);if(!res)return;showResult(res)}
function showResult(res){
  if(res.text){hist.push('chat');cur=null;render(res);return}   // плагін показав екран (ньюзрум, стікери, імпорт…)
  for(const n of res.notes||[]) if(!(res.replies||[]).length) toast(n);
  openChat(false);
}
const AVATARS={gemini:['✦','#4285F4','Gemini'],openrouter:['⇄','#7B4FD8','OpenRouter'],groq:['⚡','#F57C00','Groq'],mistral:['M','#D32F2F','Mistral'],
  nvidia:['N','#76B900','NVIDIA'],ollama_cloud:['🦙','#333','Ollama Cloud'],ollama_local:['🦙','#555','Моя Ollama'],cloudflare:['☁','#F38020','Cloudflare'],cohere:['C','#39594D','Cohere']};
function avatar(p){const a=AVATARS[p];if(a)return {icon:a[0],color:a[1],name:a[2]};let h=0;for(const c of (p||'?'))h=(h*31+c.charCodeAt(0))%360;
  return {icon:((p||'?')[0]||'?').toUpperCase(),color:'hsl('+h+',55%,45%)',name:p||'ШІ'}}
function mdHtml(t){ // Markdown відповіді ШІ → охайне оформлення
  const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const blocks=[];
  t=(t||'').replace(/```[\w-]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push(c);return '\u0000'+(blocks.length-1)+'\u0000'});
  t=esc(t).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\[([^\]\n]{1,120})\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2">$1</a>')
   .replace(/^#{1,6}\s+(.+)$/gm,'<b>$1</b>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^\w*])\*([^*\n]+)\*(?![\w*])/g,'$1<i>$2</i>')
   .replace(/^(\s*)[-*]\s+/gm,'$1• ').replace(/\u0000(\d+)\u0000/g,(_,i)=>'<pre>'+esc(blocks[+i])+'</pre>');
  return t}
function userInfo(){const u=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user)||{};return {name:[u.first_name,u.last_name].filter(Boolean).join(' '),username:u.username||''}}
function pickFile(caption){const f=document.getElementById('filein');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;
  if(file.size>15*1024*1024){toast('Файл більший за 15 МБ — надішліть його в чат');return}
  const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(file)});
  document.getElementById('sheet').classList.remove('on');toast('📎 Надсилаю '+file.name+'…');
  const res=await call('file',cur||'chat',{name:file.name,mime:file.type,b64,text:caption||'',user:userInfo()});if(res)showResult(res)};f.click()}
function syncBack(){try{hist.length?TG.BackButton.show():TG.BackButton.hide()}catch(_){}}
function capText(h){return h&&typeof h==='object'?h.t:(h||'')}
function makeCap(h,cls){const t=capText(h);if(!t)return null;const sm=document.createElement('small');sm.className=cls||'bh';sm.textContent=t;
  const sz=h&&typeof h==='object'?+h.s:0;if(sz){sm.style.fontSize=sz+'px';sm.style.whiteSpace='normal'}else sm.dataset.fit='1';return sm}
function fitAll(){requestAnimationFrame(()=>{for(const el of document.querySelectorAll('[data-fit]')){
  // спершу пробуємо вмістити в один рядок, зменшуючи шрифт; не вийшло — два рівні рядки
  const max=parseFloat(el.dataset.max||11.5),min=parseFloat(el.dataset.min||8.5);let f=max;
  el.style.whiteSpace='nowrap';el.style.fontSize=f+'px';el.style.textWrap='';
  while(el.scrollWidth>el.clientWidth+1&&f>min){f-=.5;el.style.fontSize=f+'px'}
  if(el.scrollWidth>el.clientWidth+1){el.style.whiteSpace='normal';el.style.textWrap='balance';el.style.fontSize=Math.max(min+1,10)+'px'}}})}
let lpFired=false;
function longPress(b,label,h){let t=null;const start=()=>{lpFired=false;t=setTimeout(()=>{lpFired=true;haptic('medium');editCap(label,h)},550)},stop=()=>clearTimeout(t);
  b.addEventListener('touchstart',start,{passive:true});b.addEventListener('touchend',stop);b.addEventListener('touchmove',stop);b.addEventListener('mousedown',start);b.addEventListener('mouseup',stop);
  b.addEventListener('contextmenu',e=>{e.preventDefault()});
  b.addEventListener('click',e=>{if(lpFired){e.stopImmediatePropagation();e.preventDefault();lpFired=false}},true)}
let capEdit=null;
function editCap(label,h){capEdit={label,size:h&&typeof h==='object'?+h.s:0};
  askInput('<b>✏️ Підпис під кнопкою</b>\n«'+label.replace(/</g,'&lt;')+'»\nНапишіть свій текст (порожньо — без підпису). Розмір — кнопками нижче.','hint');
  document.getElementById('sheett').value=capText(h);
  let r=document.getElementById('capsz');if(!r){r=document.createElement('div');r.id='capsz';r.className='seg';r.style.margin='8px 0 0';document.getElementById('sheett').after(r)}
  const opts=[[0,'Авто'],[9,'Дрібний'],[10.5,'Малий'],[12,'Середній'],[13.5,'Більший']];
  const draw=()=>{r.innerHTML='';for(const [v,n] of opts){const b=document.createElement('button');b.textContent=n;if(capEdit.size===v)b.className='sel';b.onclick=()=>{capEdit.size=v;draw()};r.appendChild(b)}
    const x=document.createElement('button');x.textContent='↺ Стандартний';x.onclick=async()=>{document.getElementById('sheet').classList.remove('on');await call('hint',cur,{label:capEdit.label,text:null});capEdit=null;reopen()};r.appendChild(x)};
  draw();r.style.display='flex'}
function reopen(){if(cur==='menu'){menuCache=null;openMenu(false)}else if(cur&&cur!=='chat'){curTitle='';open_(cur,false)}}
function drawRows(parent, rows, H){
  let list=null; H=H||[];
  (rows||[]).forEach((row,ri)=>{const rh=H[ri];
    const segment = row.length>1 && row.every(([t])=>t.length<=24);
    if(segment){list=null;const g=document.createElement('div');g.className='seg';
      row.forEach(([t,d],bi)=>{if(/^[^\p{L}]*Назад$/u.test(t)||t.startsWith('«'))return;const b=document.createElement('button');b.textContent=(t.startsWith('● ')?t.slice(2):t);if(t.startsWith('● '))b.className='sel';
        const h=Array.isArray(rh)?rh[bi]:'';const sm=makeCap(h);if(sm)b.appendChild(sm);
        longPress(b,t,typeof rh==='string'?rh:h);b.onclick=()=>press(t,d);g.appendChild(b)});
      parent.appendChild(g);
      if(typeof rh==='string'&&rh){const c=document.createElement('div');c.className='rowhint';c.textContent=rh;c.dataset.fit='1';c.dataset.max='11';parent.appendChild(c)}
      return}
    row.forEach(([t,d],bi)=>{
      if(/^[^\p{L}]*Назад$/u.test(t)||t.startsWith('«')) return;
      if(!list){list=document.createElement('div');list.className='list';parent.appendChild(list)}
      const s=split(t);const b=document.createElement('button');b.className='cell'+(/^🗑|видалити/i.test(t)?' danger':'');
      b.innerHTML='<span class="em"></span><span class="lb"></span>'+(s.badge?'<span class="badge"></span>':'')+'<span class="chev">›</span>';
      b.querySelector('.em').textContent=s.icon||'•';b.querySelector('.lb').textContent=s.rest;if(s.badge)b.querySelector('.badge').textContent=s.badge;
      const h=typeof rh==='string'?rh:(rh||[])[bi];const sm=makeCap(h);if(sm)b.querySelector('.lb').appendChild(sm);
      longPress(b,t,h);b.onclick=()=>press(t,d);list.appendChild(b)});
    if(row.length>1) list=null;
  });
}
function drawSections(main,res){
  // Об'єднаний розділ: кожна частина згортається окремо (стан запам'ятовується)
  const key='orion_fold:'+(res.text||'').split('\n')[0];let st={};try{st=JSON.parse(localStorage.getItem(key)||'{}')}catch(_){}
  for(const sec of res.sections){
    const box=document.createElement('div');box.className='fold'+(st[sec.head]?' shut':'');
    const h=document.createElement('button');h.className='foldh';h.innerHTML='<span></span><i>▾</i>';h.firstChild.textContent=sec.head;
    h.onclick=()=>{box.classList.toggle('shut');st[sec.head]=box.classList.contains('shut');try{localStorage.setItem(key,JSON.stringify(st))}catch(_){}haptic()};
    const inner=document.createElement('div');inner.className='foldb';
    if(sec.body){const c=document.createElement('div');c.className='card';c.innerHTML=sanitize(sec.body);inner.appendChild(c)}
    drawRows(inner,sec.rows,sec.hints);
    box.append(h,inner);main.appendChild(box)}
  const used=new Set(res.sections.flatMap(x=>(x.rows||[]).flat().map(b=>b[1])));
  const rest=(res.rows||[]).map(r=>r.filter(([t,d])=>!used.has(d)&&d!=='m:noop')).filter(r=>r.length);
  if(rest.length) drawRows(main,rest,[]);
}
function render(res, bare){
  const main=document.getElementById('main'); main.innerHTML=''; main.style.paddingBottom='';
  const comp=document.getElementById('composer'); if(comp) comp.style.display='none'; const mb=document.getElementById('mbar'); if(mb) mb.remove();
  const lines=(res.text||'').split('\n'); const title=lines.shift().replace(/<[^>]+>/g,'').trim();
  let rest=lines.join('\n').replace(/^\n+/,''); let sub='';
  const p=rest.split('\n\n'); if(p.length>1 && p[0].length<160 && !/<b>/.test(p[0])){sub=p.shift();rest=p.join('\n\n')}
  const top=document.createElement('div');top.className='top';top.innerHTML='<h1></h1>';top.querySelector('h1').textContent=title||'OrionAI';
  if(!bare){
    const chat=document.createElement('button');chat.className='ic pill';chat.title='Продовжити цей екран у чаті з ботом';chat.textContent='↗ Чат-бот';chat.onclick=toChat;
    const imp=document.createElement('button');imp.className='ic'+(marking?' on':'');imp.title='Позначити для «Покращити»';imp.textContent='💡';imp.onclick=()=>{marking=!marking;document.body.classList.toggle('marking',marking);imp.classList.toggle('on',marking);if(marking)toast('💡 Торкніться того, що треба покращити')};
    top.append(imp,chat)}
  main.appendChild(top);
  if(sub){const s=document.createElement('div');s.className='sub';s.innerHTML=sanitize(sub);main.appendChild(s)}
  if(res.sections&&res.sections.length) rest='';
  if(rest.trim()){const c=document.createElement('div');c.className='card';c.innerHTML=sanitize(rest.trim());c.onclick=()=>{if(marking)mark('текст екрана','',c.textContent)};main.appendChild(c)}
  for(const n of res.notes||[]){const d=document.createElement('div');d.className='notes';d.innerHTML='<div></div>';d.firstChild.textContent=n;main.appendChild(d)}
  if(res.sections&&res.sections.length){drawSections(main,res);}
  else drawRows(main,res.rows,res.hints);
  if(!(res.rows||[]).length && !rest.trim()){const e=document.createElement('div');e.className='empty';e.textContent='Тут поки порожньо';main.appendChild(e)}
  if(res.toast) toast(res.toast);
  if(res.awaiting) askInput(res.text);
  tabs(); window.scrollTo(0,0); fitAll();
}
async function openMenu(push=true){
  const my=++seq; if(push && cur && curView && cur!=='menu') hist.push(cur); cur='menu'; curView=true; curTitle='☰'; syncBack();
  if(menuCache) renderMenu(menuCache); else {tabs();loading()}
  const res=await call('menu','m:home'); if(my!==seq||!res) return; menuCache=res; setTabs(res.tabs); renderMenu(res);
}
function renderMenu(res){
  const main=document.getElementById('main'); const q=(document.getElementById('msearch')||{}).value||'';
  main.innerHTML=''; main.style.paddingBottom=''; const comp=document.getElementById('composer'); if(comp) comp.style.display='none'; const mb=document.getElementById('mbar'); if(mb) mb.remove();
  const top=document.createElement('div');top.className='top';top.innerHTML='<h1>☰ Меню</h1>';main.appendChild(top);
  const info=document.createElement('div');info.className='info';
  for(const it of res.info||[]){const b=document.createElement('button');b.innerHTML='<small></small><b></b>';b.querySelector('small').textContent=it.icon+' '+it.label;b.querySelector('b').textContent=it.value;b.onclick=()=>press(it.label,it.data);info.appendChild(b)}
  main.appendChild(info);
  const s=document.createElement('input');s.id='msearch';s.className='search';s.placeholder='🔍 Пошук розділу';s.value=q;s.style.marginTop='14px';main.appendChild(s);
  const ed=document.createElement('div');ed.className='edit';
  if(editTabs){const note=document.createElement('div');note.className='notes';note.innerHTML='<div></div>';
    note.firstChild.textContent='📌 Оберіть до '+(res.tabs_max||4)+' кнопок для панелі внизу, у потрібному порядку. «☰ Меню» лишається завжди. Обрано: '+editTabs.length;main.appendChild(note);
    ed.innerHTML='<button>Скасувати</button><button class="pri">Зберегти панель</button>';
    ed.children[0].onclick=()=>{editTabs=null;renderMenu(res)};
    ed.children[1].onclick=async()=>{const r=await call('tabs','m:home',{tabs:editTabs});editTabs=null;if(r){menuCache=r;setTabs(r.tabs);toast('📌 Панель збережено');renderMenu(r)}else renderMenu(res)}}
  else{ed.innerHTML='<button>📌 Налаштувати панель унизу</button>';ed.children[0].onclick=()=>{haptic();editTabs=(res.tabs||[]).map(t=>t.key);renderMenu(res)}}
  main.appendChild(ed);
  const body=document.createElement('div');main.appendChild(body);
  const secs=editTabs?[{title:'Розмова з ШІ',items:[{key:'chat',label:'💬 Розмова',data:'chat',hint:'Чат із ШІ прямо в застосунку'}]}].concat(res.sections||[]):(res.sections||[]);
  const draw=()=>{body.innerHTML='';const f=s.value.trim().toLowerCase();let n=0;
    for(const sec of secs){const its=sec.items.filter(i=>!f||i.label.toLowerCase().includes(f)||sec.title.toLowerCase().includes(f));if(!its.length)continue;
      const h=document.createElement('div');h.className='sec';h.textContent=sec.title;body.appendChild(h);
      const g=document.createElement('div');g.className='grid';
      for(const it of its){n++;const sp=split(it.label);const b=document.createElement('button');b.className='tile';
        const pos=editTabs?editTabs.indexOf(it.key):-1;
        b.innerHTML='<span class="em"></span><span class="tx"><span></span><small></small></span>'+(editTabs?(pos>=0?'<span class="num">'+(pos+1)+'</span>':''):(it.why?'<span class="q" title="Що це і як скасувати">ⓘ</span>':''));
        if(pos>=0) b.classList.add('pick');
        b.querySelector('.em').textContent=sp.icon||'•';b.querySelector('.tx span').textContent=sp.rest;const tsm=b.querySelector('small');tsm.textContent=it.hint||'';
        if(it.hs){tsm.style.fontSize=it.hs+'px'}else{tsm.dataset.fit='1';tsm.dataset.max='11.5';tsm.dataset.min='9'}
        if(!editTabs) longPress(b,it.label,{t:it.hint||'',s:it.hs||0});
        if(it.why&&!editTabs) b.querySelector('.q').onclick=e=>{e.stopPropagation();press('ⓘ '+it.label,it.why)};
        b.onclick=editTabs?()=>{haptic();const i=editTabs.indexOf(it.key);if(i>=0)editTabs.splice(i,1);else if(editTabs.length>=(res.tabs_max||4)){toast('Панель повна — спершу зніміть одну з кнопок');return}else editTabs.push(it.key);renderMenu(res)}:()=>press(it.label,it.data);g.appendChild(b)}
      body.appendChild(g)}
    if(!n){const e=document.createElement('div');e.className='empty';e.textContent='Нічого не знайдено';body.appendChild(e)}};
  s.oninput=()=>{draw();fitAll()}; draw(); tabs(); fitAll();
}
function back(){if(!hist.length)return;const h=hist.pop();curTitle='';h==='chat'?openChat(false):h==='menu'?openMenu(false):open_(h,false)}
function tabs(){const n=document.getElementById('tabs');n.innerHTML='';
  const all=TABS.concat([MENU_TAB]);
  const active=all.find(([d])=>cur&&(cur===d||cur.startsWith(d+':')))||MENU_TAB;
  for(const tb of all){const b=document.createElement('button');b.className=tb===active?'on':'';b.innerHTML='<span>'+tb[1]+'</span>'+tb[2];
    b.onclick=()=>{haptic();hist=[];cur=null;curTitle='';curView=true;editTabs=null;tb[0]==='chat'?openChat(false):tb[0]==='menu'?openMenu(false):open_(tb[0],false)};n.appendChild(b)}}
function press(label, d){
  if(marking){mark('кнопка «'+label+'»',d,'');return}
  haptic();
  if(d.startsWith('url:')){try{TG.openLink(d.slice(4))}catch(_){window.open(d.slice(4))}return}
  if(d.startsWith('app:')){toast('Ви вже в застосунку');return}
  if(d==='m:cancel'){cancelInput();return}
  if(d==='m:home'){openMenu();return}
  if(!/^(m:|help:)/.test(d)){toast('Це доступно в чаті з ботом');return}
  open_(d);
}
function askInput(text, mode){const fb=document.getElementById('sheetfile');if(fb)fb.style.display=(mode==='hint'||mode==='mark')?'none':'';document.getElementById('sheetmode').value=mode||'text';document.getElementById('sheetq').innerHTML=sanitize((text||'').split('\n').slice(0,3).join('\n'));document.getElementById('sheett').value='';document.getElementById('sheet').classList.add('on');setTimeout(()=>document.getElementById('sheett').focus(),250)}
async function sendInput(){const t=document.getElementById('sheett').value.trim();
  if(document.getElementById('sheetmode').value==='mark'){document.getElementById('sheet').classList.remove('on');return saveMark(t)}
  if(document.getElementById('sheetmode').value==='hint'){document.getElementById('sheet').classList.remove('on');const c=capEdit;capEdit=null;
    const r=document.getElementById('capsz');if(r)r.style.display='none';
    if(c){await call('hint',cur,{label:c.label,text:document.getElementById('sheett').value.trim(),size:c.size});toast('✏️ Підпис змінено');reopen()}return}
  if(!t)return;document.getElementById('sheet').classList.remove('on');
  const res=await call('text',cur,{text:t});if(!res)return;if(res.text){render(res)}else{for(const n of res.notes||[])toast(n);if(res.toast)toast(res.toast)}}
async function cancelInput(){const m=document.getElementById('sheetmode').value;document.getElementById('sheet').classList.remove('on');const cz=document.getElementById('capsz');if(cz)cz.style.display='none';
  if(m==='hint'){capEdit=null;return}if(m==='mark'){pending=null;return}await call('screen','m:cancel');back()}
async function toChat(){haptic('medium');await call('tochat',(cur&&cur!=='chat')?cur:'m:home');toast('💬 Екран надіслано в чат');setTimeout(()=>{try{TG.close()}catch(_){}} ,350)}
let pending=null;
function mark(target, action, excerpt){
  marking=false;document.body.classList.remove('marking');pending={target,action,excerpt:(excerpt||'').slice(0,300)};
  askInput('<b>💡 Додати в «Покращити»</b>\n'+target.replace(/</g,'&lt;')+'\nЩо не так і що запропонувати? Можна залишити порожнім.','mark');
  document.querySelectorAll('.ic').forEach(b=>b.classList.remove('on'));
}
async function saveMark(note){
  if(!pending)return;const m=Object.assign({where:'app',screen:cur||'',note},pending);pending=null;
  try{const r=await fetch(new URL('improve',API.replace(/app\/api$/,'')).href,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData:init,marks:[m]})});toast(r.ok?'💡 Додано в «Покращити»':'Не вдалося зберегти')}catch(_){toast('Не вдалося зберегти')}
}
if(TG){TG.ready();TG.expand();try{TG.BackButton.onClick(back)}catch(_){}}
(function start(){
  if(TG && TG.isVersionAtLeast && !TG.isVersionAtLeast('6.1')){
    render({text:'<b>Цей Telegram не підтримує застосунок</b>\nУсе те саме доступне в чаті з ботом кнопками. Оновіть Telegram, щоб користуватись і застосунком.',rows:[]},true);return}
  const first=HASH[(location.hash||'').slice(1)]||(TG&&TG.initDataUnsafe&&HASH[TG.initDataUnsafe.start_param])||(TABS[0]&&TABS[0][0])||'menu';
  if(init) call('menu','m:home').then(r=>{if(r&&r.tabs){menuCache=r;setTabs(r.tabs)}});
  first==='chat'?openChat(false):first==='menu'?openMenu(false):open_(first,false);
})();
</script>
